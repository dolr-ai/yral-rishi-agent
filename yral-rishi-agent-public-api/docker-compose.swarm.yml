# ---------------------------------------------------------------------------
# docker-compose.swarm.yml — the production Swarm-stack variant.
#
# ⭐ START HERE if you're new to the file:
#   1. This file deploys the SERVICE ONLY into a running Swarm cluster.
#   2. Postgres, Redis, pgBouncer, Langfuse are NOT here — they're owned
#      by Session 1's cluster stateful-core stack on rishi-4/5/6, and
#      this service connects to them via Swarm OVERLAY NETWORKS.
#   3. Deploy: `docker stack deploy -c docker-compose.swarm.yml <name>`
#
# WHY IS THIS DIFFERENT FROM docker-compose.yml?
# docker-compose.yml is for a single dev laptop. This file is for a
# cluster of 3 servers running Docker Swarm. The differences:
#
#   - No `build:` — Swarm pulls a pre-built image from GHCR (per F13).
#   - No `ports:` — only the edge Caddy stack publishes 443 (per C3).
#     Everything else is overlay-only, invisible from the public internet.
#   - `deploy:` block — replica count, rolling-update behavior, placement
#     constraints, resource limits. These don't exist in plain Compose.
#   - `secrets:` — runtime secrets mounted from Swarm's encrypted store,
#     never from env vars in this file (per D1).
#   - `networks:` references the 3 overlays Saikat directed (per C3):
#     yral-v2-public-web (front-facing), yral-v2-internal (service-to-
#     service), yral-v2-data-plane (Postgres + Redis + Langfuse traffic).
#
# WHO USES THIS FILE?
# The CI deploy workflow (per CONSTRAINTS I2) renders this file with
# project-specific values from project.config, then runs
# `docker stack deploy` on a Swarm manager. Humans don't edit per-deploy
# values inline.
#
# RELATED FILES (footer at the end).
# ---------------------------------------------------------------------------

# Swarm needs an explicit version on stack files; "3.9" is the highest
# Swarm-compatible Compose schema.
version: "3.9"


# ===========================================================================
# services — the one container that gets deployed by this stack.
# ===========================================================================
services:

  # -------------------------------------------------------------------------
  # service — the running app, pulled from GHCR.
  # -------------------------------------------------------------------------
  service:

    # Image reference points to GHCR (per CONSTRAINTS F13).
    #
    # The literal "${IMAGE_REPO}:${IMAGE_TAG}" is a Compose variable
    # substitution: CI exports IMAGE_REPO from project.config and
    # IMAGE_TAG from the git SHA, then runs `docker stack deploy`. Both
    # MUST be set or the deploy fails — there's intentionally no default
    # (a missing tag should NEVER fall back to "latest").
    image: ${IMAGE_REPO}:${IMAGE_TAG}

    # Environment variables at runtime. Anything sensitive comes from
    # Swarm secrets (see `secrets:` below), NOT from this list. Values
    # here are non-sensitive: feature flags, environment name, log level.
    #
    # The actual secret values are mounted as files at /run/secrets/<name>
    # and the entrypoint wrapper below exports them as env vars so the
    # app's `os.environ.get(...)` / pydantic-settings reads see them.
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    # Entrypoint wrapper — Day-5 secret-file → env-var bridge per D8.
    #
    # Per D1+D8 production secrets flow: GitHub Secret → Swarm secret at
    # deploy → env var at container start. Swarm mounts each `secrets:`
    # entry as a file at /run/secrets/<name>; this one-line shell wrapper
    # reads every file in that directory + `export`s its content as an
    # env var of the same name, then `exec`s uvicorn so the FastAPI
    # process inherits them via os.environ.
    #
    # Empty files (e.g. SENTRY_DSN with no value yet) export an empty
    # string — the app handles empty values the same way as
    # missing-env-var (Sentry SDK no-ops; Langfuse SDK no-ops behind
    # LANGFUSE_TRACING_ENABLED=false).
    #
    # Why a compose-level wrapper instead of a Dockerfile ENTRYPOINT?
    # Keeps the image identical across services (the new-service.sh
    # spawner doesn't have to template the Dockerfile per service);
    # the wrapper is a deploy-time concern that lives in compose where
    # all the other Swarm-specific config (secrets: block, deploy:
    # block) already lives.
    command:
      - sh
      - -c
      - |
        for s in /run/secrets/*; do
          if [ -f "$$s" ]; then
            export "$$(basename "$$s")=$$(cat "$$s")"
          fi
        done
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000

    # Per-replica resource caps. The defaults below are conservative
    # starting points; tune per service after the first week of prod
    # data. Reservations are guarantees; limits are hard caps.
    deploy:

      # 3 replicas per CONSTRAINTS G2 (horizontal-scale from day 1).
      # Swarm will spread them across the 3 cluster nodes.
      replicas: 3

      # Rolling update: replace one replica at a time, wait for health
      # check to go green, then move on. Total replacement takes ~3x
      # the per-replica health-check time — slow on purpose so a bad
      # deploy can be caught + rolled back before all 3 are down.
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 30s

      # If a deploy fails: drop back to the previous image tag. Per
      # CONSTRAINTS I2 (canary deploy + auto-rollback per service).
      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first

      # Hard resource limits per replica. Tune per service in
      # project.config once we see real prod data.
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

      # Restart on crash, max 3 times in 60s. Beyond that, leave the
      # replica down so monitoring notices (rather than silently
      # crash-looping).
      restart_policy:
        condition: any
        max_attempts: 3
        window: 60s

      # Labels Caddy uses to discover this service via the Caddy Swarm
      # plugin. The edge Caddy stack (deployed by Session 1) reads these
      # to auto-route public traffic to the service's overlay endpoint.
      labels:
        - "caddy=${PROJECT_DOMAIN}"
        - "caddy.reverse_proxy={{upstreams 8000}}"

    # Health check Swarm runs every 10s against the running container.
    # If 3 in a row fail, Swarm marks the replica unhealthy and the
    # rolling-update logic kicks in. We hit /health/ready (per F9), which
    # returns 503 when any downstream dep is unreachable.
    #
    # Uses Python (always present in the runtime image — it IS the app)
    # instead of curl/wget (NOT in the python:3.12-slim base; Day-5 first
    # deploy hit a restart loop because the wget probe always exited
    # 127 → Swarm marked unhealthy → restart, regardless of actual
    # /health/ready status). One-line urllib.request usage; raises on
    # non-2xx so non-zero exit triggers Swarm's unhealthy state correctly.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

    # Three Swarm overlay networks (per CONSTRAINTS C3):
    #   - yral-v2-public-web   front-facing traffic from edge Caddy
    #   - yral-v2-internal     service-to-service RPC
    #   - yral-v2-data-plane   Postgres + Redis + Langfuse traffic
    networks:
      - yral-v2-public-web
      - yral-v2-internal
      - yral-v2-data-plane

    # Runtime secrets mounted from Swarm's encrypted secret store. Each
    # name corresponds to a secret created out-of-band via
    # `docker secret create <name> <file>` (or via Session 1's
    # cluster-bootstrap automation). The app reads them as files from
    # /run/secrets/<name>.
    #
    # Names UPPER_SNAKE_CASE matching `secrets.yaml` verbatim per D8
    # (manifest is source of truth; 2026-05-20 Day-5 alignment).
    #
    # uid/gid 1001 matches the appuser the Dockerfile creates + runs
    # uvicorn as. Without explicit uid/gid the secret files default
    # to root:root + mode 0400 → unreadable by appuser → the
    # entrypoint wrapper's `cat /run/secrets/<name>` fails silently +
    # the app starts with empty env vars (Day-5 first-deploy bug;
    # caught + fixed here on the 2026-05-20 deploy retry).
    secrets:
      - source: REDIS_URL
        target: REDIS_URL
        uid: "1001"
        gid: "1001"
        mode: 0400
      - source: SENTRY_DSN
        target: SENTRY_DSN
        uid: "1001"
        gid: "1001"
        mode: 0400
      - source: LANGFUSE_PUBLIC_KEY
        target: LANGFUSE_PUBLIC_KEY
        uid: "1001"
        gid: "1001"
        mode: 0400
      - source: LANGFUSE_SECRET_KEY
        target: LANGFUSE_SECRET_KEY
        uid: "1001"
        gid: "1001"
        mode: 0400


# ===========================================================================
# networks — the overlays this service plugs into.
# ===========================================================================
#
# `external: true` means these overlays already exist in the Swarm —
# they were created by Session 1's cluster-bootstrap scripts. This
# service does NOT create them; it just attaches to them. Trying to
# deploy this stack against a Swarm where the overlays don't yet exist
# fails immediately with a clear error.
networks:
  yral-v2-public-web:
    external: true
  yral-v2-internal:
    external: true
  yral-v2-data-plane:
    external: true


# ===========================================================================
# secrets — references to Swarm-managed secrets, declared as external.
# ===========================================================================
#
# Same pattern as networks: these secrets are created outside this file
# (Session 1's bootstrap or `gh secret set` + CI sync). Declaring them
# external means the Swarm verifies their existence at deploy time and
# fails fast if any are missing.
#
# The full list of secrets THIS service needs is the source of truth in
# `secrets.yaml` (per CONSTRAINTS D8, added in PR 3). new-service.sh
# generates the `secrets:` block above from secrets.yaml automatically.
secrets:
  REDIS_URL:
    external: true
  SENTRY_DSN:
    external: true
  LANGFUSE_PUBLIC_KEY:
    external: true
  LANGFUSE_SECRET_KEY:
    external: true


