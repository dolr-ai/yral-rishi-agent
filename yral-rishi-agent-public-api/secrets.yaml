# ===========================================================================
# secrets.yaml.template — per-service secrets MANIFEST template (per D8).
# ===========================================================================
#
# ⭐ START HERE: this file is the *template*. `scripts/new-service.sh`
# (Day 3) copies it into each spawned service folder as `secrets.yaml`
# and sed-substitutes yral-rishi-agent-public-api with the new service's name.
#
# WHAT IS A "SECRETS MANIFEST"?
# A declaration of every secret THIS service needs. Each entry has
# metadata (description, source-per-env, rotation policy, what code
# files consume it, blast-radius classification) but NEVER the secret
# value itself. Values live in:
#   - `.env.local` for local development (gitignored)
#   - GitHub Secrets for CI
#   - Swarm secrets (mounted as files at /run/secrets/) for production
# Per CONSTRAINTS D1: per-service production secrets flow GitHub Secret
# → Swarm secret at deploy → env var / file at container start.
# Vault is for cross-service shared secrets ONLY.
#
# WHY MANIFEST + BRIDGE SCRIPTS (per D8)?
#   - `scripts/validate-secrets.sh` reads this and verifies every required
#     secret has a value in every required env (fails CI if missing).
#   - `scripts/sync-github-secrets.sh` reads this and interactively
#     populates missing GitHub Secrets via `gh secret set`.
#   - `scripts/gen-env-example.sh` reads this and regenerates
#     `.env.example` so devs can `cp .env.example .env.local` and see
#     every variable they need to fill in.
#
# SCHEMA (full reference in
# yral-rishi-agent-plan-and-discussions/secrets-management-pattern-
# for-every-v2-service/01-secrets-yaml-schema-and-example.md):
#
#   service: <service-name>
#   secrets:
#     - name: SECRET_NAME              # UPPER_SNAKE_CASE per B1
#       description: |
#         One-sentence plain-English explanation.
#       required_in: [local, ci, production]
#       source:
#         local: ".env.local"
#         ci: "GitHub Secret <SECRET_NAME>"
#         production: "GitHub Secret <SECRET_NAME> → Swarm secret at deploy"
#       rotation_policy: "every X days" or "stable" or "rotated when ..."
#       consumed_by:
#         - app/some_file.py
#       classification:
#         blast_radius: low|medium|high
#         access_pattern: read|write|admin
#       notes: |
#         Optional extra context.
#
# THE SECRETS BELOW ARE THE PHASE-1 SET FOR THIS SERVICE.
#
# Day-5 alignment (per Session 3 Day-5 directive, 2026-05-20): the
# template's inherited 5-secret default was trimmed for Phase-1
# public-api per A2.1 + a runtime-import audit:
#   - DROPPED `DATABASE_URL` — public-api is a thin HTTP gateway with
#     NO direct asyncpg/psycopg/alembic consumer. The DB lives behind
#     the orchestrator + soul-file-library services (each owns its own
#     pool). Re-add this if a future PR adds direct DB access here.
#   - RENAMED `REDIS_SENTINEL_PASSWORD` → `REDIS_URL` — `app/redis_client.py`
#     uses `redis.Redis.from_url(settings.redis_url)`, not a separate
#     password env var. Sentinel auth (per C11) embeds in the URL as
#     `redis://:<password>@<sentinel-host>:6379/0`. Health probe +
#     idempotency cache + JWKS cache all share the same client.
#   - KEPT `SENTRY_DSN`, `LANGFUSE_PUBLIC_KEY`, `LANGFUSE_SECRET_KEY` —
#     all 3 are read at runtime by `app/sentry_middleware.py` and
#     `app/langfuse_middleware.py` respectively.
#
# Service-specific secrets (OPENROUTER_API_KEY for Tara routing,
# JWKS_URL if auth.yral.com ever rotates URL, etc.) get added below
# the inherited set when those features land.
#
# RELATED FILES (footer at the end).
# ===========================================================================

# Replaced by new-service.sh with the spawned service's name.
service: yral-rishi-agent-public-api

secrets:

  # -------------------------------------------------------------------------
  # REDIS_URL — full Redis connection URL (Sentinel password baked in).
  # -------------------------------------------------------------------------
  - name: REDIS_URL
    description: |
      Full Redis connection URL. Production format with Sentinel auth:
        redis://:<password>@<sentinel-or-primary-host>:6379/0
      Used by:
        - app/redis_client.py — singleton `redis.Redis.from_url(...)` that
          backs the JWKS cache (per E9) + the F10 idempotency-dedup cache.
        - app/api/health_routes.py — async Sentinel-aware ping per C11
          (Sentinel-quorum primary discovery + reconnect-on-failover).
      Per C11 production uses the Sentinel quorum (3 sentinels on
      rishi-4/5/6); local dev + docker-compose use a single-primary URL
      (`redis://localhost:6379/0`).
    required_in: [local, ci, production]
    source:
      local: ".env.local (e.g. redis://localhost:6379/0)"
      ci: "GitHub Secret REDIS_URL"
      production: "GitHub Secret REDIS_URL → Swarm secret at deploy"
    rotation_policy: "every 180 days; rotates when the Sentinel password rotates"
    consumed_by:
      - app/redis_client.py
      - app/api/health_routes.py
      - app/api/auth/jwks_client.py
      - app/api/idempotency.py
    classification:
      blast_radius: medium
      access_pattern: read+write
    notes: |
      Per-service Redis ACL (Session 1's stateful-core stack) limits each
      service to its own key prefix, so a leak only exposes this service's
      cache contents (JWKS bytes + idempotency keys), not other services'
      data.

  # -------------------------------------------------------------------------
  # REDIS_PASSWORD — AUTH credential sent in response to Redis primary's
  # `--requirepass` challenge (per H3 + 2026-05-22 incident-response
  # rotation).
  # -------------------------------------------------------------------------
  - name: REDIS_PASSWORD
    description: |
      Password sent to the Redis primary in response to its AUTH
      challenge. The v2 cluster's Redis primary runs with
      `--requirepass` enabled; every connection to the primary
      MUST AUTH or first command raises
      `redis.exceptions.AuthenticationError: Authentication required.`
      Consumed by BOTH Redis paths in this service:
        - app/redis_client.py — passed as `password=` kwarg to
          redis.Redis.from_url() (JWKS-cache + idempotency-dedup
          singleton)
        - app/api/health_routes.py — passed as `password=` kwarg to
          Sentinel.master_for() (C11 /health/ready probe)
    required_in: [ci, production]
    source:
      local: "Not required — local docker-compose Redis runs without --requirepass"
      ci: "GitHub Secret REDIS_PASSWORD"
      production: "Swarm secret yral_v2_redis_primary_password_<sha> mapped to logical name REDIS_PASSWORD via compose external:name"
    rotation_policy: "Every 180 days, or on incident response (e.g. 2026-05-22 leak rotation)"
    consumed_by:
      - app/redis_client.py
      - app/api/health_routes.py
    classification:
      blast_radius: medium
      access_pattern: read-only
    notes: |
      Rotation pattern: create new versioned Swarm secret
      `yral_v2_redis_primary_password_<new-sha>`, then update each
      consumer's docker-compose.swarm.yml `external: name:` mapping
      to point at the new versioned secret. Roll services. Drop old
      secret last.

  # -------------------------------------------------------------------------
  # SENTRY_DSN — error tracking destination (per A7 + D3).
  # -------------------------------------------------------------------------
  - name: SENTRY_DSN
    description: |
      Sentry DSN for THIS service's project at sentry.rishi.yral.com
      (NOT apm.yral.com per A7). The middleware (added Day 2) auto-tags
      every event with service=yral-rishi-agent-public-api per D3.
    required_in: [local, ci, production]
    source:
      local: ".env.local (use a dev Sentry project so local errors don't pollute prod)"
      ci: "GitHub Secret SENTRY_DSN"
      production: "GitHub Secret SENTRY_DSN → Swarm secret at deploy"
    rotation_policy: "stable; rotates only if Sentry org migrates"
    consumed_by:
      - app/sentry_middleware.py
    classification:
      blast_radius: low
      access_pattern: write-only
    notes: |
      Sentry DSNs are write-only by design — a leaked DSN lets an
      attacker submit fake events, but not read existing ones.

  # -------------------------------------------------------------------------
  # LANGFUSE_PUBLIC_KEY — LLM trace ingestion key (per D4).
  # -------------------------------------------------------------------------
  - name: LANGFUSE_PUBLIC_KEY
    description: |
      Langfuse project public key. Identifies which Langfuse project the
      service's LLM traces land in. Paired with LANGFUSE_SECRET_KEY.
      Per D4 every service auto-traces LLM calls to langfuse.rishi.yral.com.
    required_in: [local, ci, production]
    source:
      local: ".env.local (optional — LANGFUSE_TRACING_ENABLED=false locally avoids needing real keys)"
      ci: "GitHub Secret LANGFUSE_PUBLIC_KEY"
      production: "GitHub Secret LANGFUSE_PUBLIC_KEY → Swarm secret at deploy"
    rotation_policy: "every 180 days"
    consumed_by:
      - app/langfuse_middleware.py
    classification:
      blast_radius: low
      access_pattern: write-only
    notes: |
      Public key is half of the auth pair; needs the secret key to do anything.

  # -------------------------------------------------------------------------
  # LANGFUSE_SECRET_KEY — LLM trace ingestion secret (per D4).
  # -------------------------------------------------------------------------
  - name: LANGFUSE_SECRET_KEY
    description: |
      Langfuse project secret key. Paired with LANGFUSE_PUBLIC_KEY. The
      SDK signs every trace-ingestion call with this key.
    required_in: [local, ci, production]
    source:
      local: ".env.local (optional — see LANGFUSE_PUBLIC_KEY above)"
      ci: "GitHub Secret LANGFUSE_SECRET_KEY"
      production: "GitHub Secret LANGFUSE_SECRET_KEY → Swarm secret at deploy"
    rotation_policy: "every 180 days; rotate alongside LANGFUSE_PUBLIC_KEY"
    consumed_by:
      - app/langfuse_middleware.py
    classification:
      blast_radius: medium
      access_pattern: write-only
    notes: |
      A leak only lets an attacker ingest fake traces; no read access.


