# ===========================================================================
# secrets.yaml.template — per-service secrets MANIFEST template (per D8).
# ===========================================================================
#
# ⭐ START HERE: this file is the *template*. `scripts/new-service.sh`
# (Day 3) copies it into each spawned service folder as `secrets.yaml`
# and sed-substitutes yral-rishi-agent-public-api with the new service's name.
#
# WHAT IS A "SECRETS MANIFEST"?
# A declaration of every secret THIS service needs. Each entry has
# metadata (description, source-per-env, rotation policy, what code
# files consume it, blast-radius classification) but NEVER the secret
# value itself. Values live in:
#   - `.env.local` for local development (gitignored)
#   - GitHub Secrets for CI
#   - Swarm secrets (mounted as files at /run/secrets/) for production
# Per CONSTRAINTS D1: per-service production secrets flow GitHub Secret
# → Swarm secret at deploy → env var / file at container start.
# Vault is for cross-service shared secrets ONLY.
#
# WHY MANIFEST + BRIDGE SCRIPTS (per D8)?
#   - `scripts/validate-secrets.sh` reads this and verifies every required
#     secret has a value in every required env (fails CI if missing).
#   - `scripts/sync-github-secrets.sh` reads this and interactively
#     populates missing GitHub Secrets via `gh secret set`.
#   - `scripts/gen-env-example.sh` reads this and regenerates
#     `.env.example` so devs can `cp .env.example .env.local` and see
#     every variable they need to fill in.
#
# SCHEMA (full reference in
# yral-rishi-agent-plan-and-discussions/secrets-management-pattern-
# for-every-v2-service/01-secrets-yaml-schema-and-example.md):
#
#   service: <service-name>
#   secrets:
#     - name: SECRET_NAME              # UPPER_SNAKE_CASE per B1
#       description: |
#         One-sentence plain-English explanation.
#       required_in: [local, ci, production]
#       source:
#         local: ".env.local"
#         ci: "GitHub Secret <SECRET_NAME>"
#         production: "GitHub Secret <SECRET_NAME> → Swarm secret at deploy"
#       rotation_policy: "every X days" or "stable" or "rotated when ..."
#       consumed_by:
#         - app/some_file.py
#       classification:
#         blast_radius: low|medium|high
#         access_pattern: read|write|admin
#       notes: |
#         Optional extra context.
#
# THE FIVE SECRETS BELOW ARE THE INHERITANCE — every service spawned
# from this template starts with them. Service-specific secrets (JWT
# JWKS URL, OPENROUTER_API_KEY, etc.) get added per service as needed.
#
# RELATED FILES (footer at the end).
# ===========================================================================

# Replaced by new-service.sh with the spawned service's name.
service: yral-rishi-agent-public-api

secrets:

  # -------------------------------------------------------------------------
  # DATABASE_URL — Postgres connection string.
  # -------------------------------------------------------------------------
  - name: DATABASE_URL
    description: |
      Postgres connection string this service uses to reach its OWN schema
      on the shared Patroni cluster. Format:
        postgresql://${POSTGRES_ROLE}:<password>@<pgbouncer-host>:6432/yral_v2?options=-csearch_path%3D${POSTGRES_SCHEMA}
      Per F3 the cluster is shared but each service is restricted to its
      own schema via Postgres role GRANTs. Per G3 traffic goes through
      pgBouncer (not directly to Patroni).
    required_in: [local, ci, production]
    source:
      local: ".env.local (point at the local docker-compose Postgres)"
      ci: "GitHub Secret DATABASE_URL"
      production: "GitHub Secret DATABASE_URL → Swarm secret at deploy"
    rotation_policy: "every 90 days; coordinated with Patroni role-password rotation"
    consumed_by:
      - app/database.py
      - alembic/env.py
    classification:
      blast_radius: high
      access_pattern: read+write
    notes: |
      Per-service schema means a leaked DATABASE_URL only exposes ONE
      service's data, not the whole cluster.

  # -------------------------------------------------------------------------
  # REDIS_SENTINEL_PASSWORD — auth for the HA Redis cluster.
  # -------------------------------------------------------------------------
  - name: REDIS_SENTINEL_PASSWORD
    description: |
      Auth password for the Redis Sentinel cluster (per C11). The
      Sentinel-aware client uses this to authenticate during primary
      discovery + read/write operations.
    required_in: [local, ci, production]
    source:
      local: ".env.local (the local docker-compose Redis can use 'devpassword' or be left empty)"
      ci: "GitHub Secret REDIS_SENTINEL_PASSWORD"
      production: "GitHub Secret REDIS_SENTINEL_PASSWORD → Swarm secret at deploy"
    rotation_policy: "every 180 days"
    consumed_by:
      - app/redis_client.py
    classification:
      blast_radius: medium
      access_pattern: read+write
    notes: |
      Per-service Redis ACL (Session 1's stateful-core stack) limits each
      service to its own key prefix, so a leak doesn't expose other
      services' keys.

  # -------------------------------------------------------------------------
  # SENTRY_DSN — error tracking destination (per A7 + D3).
  # -------------------------------------------------------------------------
  - name: SENTRY_DSN
    description: |
      Sentry DSN for THIS service's project at sentry.rishi.yral.com
      (NOT apm.yral.com per A7). The middleware (added Day 2) auto-tags
      every event with service=yral-rishi-agent-public-api per D3.
    required_in: [local, ci, production]
    source:
      local: ".env.local (use a dev Sentry project so local errors don't pollute prod)"
      ci: "GitHub Secret SENTRY_DSN"
      production: "GitHub Secret SENTRY_DSN → Swarm secret at deploy"
    rotation_policy: "stable; rotates only if Sentry org migrates"
    consumed_by:
      - app/sentry_middleware.py
    classification:
      blast_radius: low
      access_pattern: write-only
    notes: |
      Sentry DSNs are write-only by design — a leaked DSN lets an
      attacker submit fake events, but not read existing ones.

  # -------------------------------------------------------------------------
  # LANGFUSE_PUBLIC_KEY — LLM trace ingestion key (per D4).
  # -------------------------------------------------------------------------
  - name: LANGFUSE_PUBLIC_KEY
    description: |
      Langfuse project public key. Identifies which Langfuse project the
      service's LLM traces land in. Paired with LANGFUSE_SECRET_KEY.
      Per D4 every service auto-traces LLM calls to langfuse.rishi.yral.com.
    required_in: [local, ci, production]
    source:
      local: ".env.local (optional — LANGFUSE_TRACING_ENABLED=false locally avoids needing real keys)"
      ci: "GitHub Secret LANGFUSE_PUBLIC_KEY"
      production: "GitHub Secret LANGFUSE_PUBLIC_KEY → Swarm secret at deploy"
    rotation_policy: "every 180 days"
    consumed_by:
      - app/langfuse_middleware.py
    classification:
      blast_radius: low
      access_pattern: write-only
    notes: |
      Public key is half of the auth pair; needs the secret key to do anything.

  # -------------------------------------------------------------------------
  # LANGFUSE_SECRET_KEY — LLM trace ingestion secret (per D4).
  # -------------------------------------------------------------------------
  - name: LANGFUSE_SECRET_KEY
    description: |
      Langfuse project secret key. Paired with LANGFUSE_PUBLIC_KEY. The
      SDK signs every trace-ingestion call with this key.
    required_in: [local, ci, production]
    source:
      local: ".env.local (optional — see LANGFUSE_PUBLIC_KEY above)"
      ci: "GitHub Secret LANGFUSE_SECRET_KEY"
      production: "GitHub Secret LANGFUSE_SECRET_KEY → Swarm secret at deploy"
    rotation_policy: "every 180 days; rotate alongside LANGFUSE_PUBLIC_KEY"
    consumed_by:
      - app/langfuse_middleware.py
    classification:
      blast_radius: medium
      access_pattern: write-only
    notes: |
      A leak only lets an attacker ingest fake traces; no read access.


