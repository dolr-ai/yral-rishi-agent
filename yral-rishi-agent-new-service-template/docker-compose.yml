# ---------------------------------------------------------------------------
# docker-compose.yml — local development stack.
#
# ⭐ START HERE if you're new to the file:
#   1. `services:` lists every container that runs together: the service
#      itself, a Postgres database, a pgBouncer in front of it, and Redis.
#   2. Run `docker compose up --build` from this folder — you get a full,
#      self-contained dev environment on your laptop.
#   3. The running service is reachable at http://localhost:8000.
#
# WHAT IS DOCKER COMPOSE?
# A tool that runs multiple Docker containers TOGETHER, wired into the same
# private network so they can talk to each other by name (e.g. the app
# connects to "postgres:5432", not an IP address). For local development
# it's strictly easier than installing Postgres + Redis natively.
#
# WHO USES THIS FILE?
# Developers on their laptops (NOT production). Production runs the Swarm
# variant — see `docker-compose.swarm.yml`. Same image, different wiring.
#
# WHY THE DIFFERENCE BETWEEN THIS FILE AND THE SWARM FILE?
#   - Local: every dep runs as a sibling container so the dev needs zero
#            extra setup. Host ports are exposed so devs can `psql` into
#            Postgres + `redis-cli` into Redis from outside.
#   - Swarm: Postgres + Redis + pgBouncer are PART OF THE CLUSTER (owned
#            by Session 1's stateful-core stack on rishi-4/5/6); each
#            service only ships ITSELF, and connects to the cluster's
#            stateful services via overlay networks. No host ports.
#
# WHY IS LANGFUSE NOT IN THIS FILE?
# Langfuse's full stack (web + worker + Postgres + ClickHouse + Redis +
# MinIO) is heavy — ~1 GB of containers — and most devs don't need real
# trace recording during local work. We default to LANGFUSE_TRACING=false
# (the SDK no-ops). The shared self-hosted Langfuse on rishi-6 is the
# real-traffic destination per CONSTRAINTS D4. A future docker-compose
# profile can spin up a local Langfuse if a dev specifically wants it;
# we don't ship that profile today (A2.1: build it when someone asks).
#
# RELATED FILES (footer at the end).
# ---------------------------------------------------------------------------


# ===========================================================================
# services — the four containers that run together.
# ===========================================================================
services:

  # -------------------------------------------------------------------------
  # service — the FastAPI app itself.
  # -------------------------------------------------------------------------
  service:
    # Build from the local Dockerfile (instead of pulling from GHCR).
    # `docker compose build` reads the same Dockerfile prod CI uses, so
    # what runs locally matches what runs in prod.
    build:
      context: .
      dockerfile: Dockerfile

    # A predictable container name makes `docker logs service` work without
    # the auto-generated "yral-rishi-agent-new-service-template-service-1"
    # mouthful. Spawned services overwrite this via new-service.sh.
    container_name: yral-rishi-agent-new-service-template

    # Map host port 8000 to container port 8000 so the dev can hit
    # http://localhost:8000 from a browser. Production never publishes
    # host ports (per CONSTRAINTS C3); this is local-only.
    ports:
      - "8000:8000"

    # Environment variables the service reads at startup. We point the
    # service at the pgBouncer + Redis sibling containers by NAME — Docker
    # Compose's built-in DNS resolves "pgbouncer" + "redis" inside the
    # private network.
    #
    # DATABASE_URL — asyncpg-compatible URL. Note port 6432 (pgBouncer),
    # not 5432 (raw Postgres). All traffic goes through the bouncer so
    # the same connection-multiplexing behavior is tested locally that
    # we'll get in prod.
    #
    # REDIS_URL — plain redis:// since local has no Sentinel. In prod the
    # service uses redis.sentinel.Sentinel to discover the current
    # primary (per CONSTRAINTS C11); the same code path works locally
    # because the Sentinel-aware client falls back to a direct connection
    # when SENTINEL_NODES is empty.
    #
    # SENTRY_DSN — empty locally so the SDK no-ops. Set to the
    # sentry.rishi.yral.com DSN in prod (per CONSTRAINTS A7).
    #
    # LANGFUSE_TRACING_ENABLED=false — see file header rationale.
    environment:
      DATABASE_URL: postgresql://service:service-local-password@pgbouncer:6432/service_local_database
      REDIS_URL: redis://redis:6379/0
      SENTRY_DSN: ""
      LANGFUSE_TRACING_ENABLED: "false"
      ENVIRONMENT: local

    # Don't start the service until Postgres + pgBouncer + Redis are
    # actually accepting connections — without this, the service might
    # start first, fail to connect, and crash-loop until the deps catch up.
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

    # Mount the app source as a volume in dev so code changes don't need
    # a full rebuild. uvicorn[standard] notices the file change via
    # watchfiles and reloads. Production never volume-mounts source — the
    # image is the source of truth.
    volumes:
      - ./app:/app/app:ro

    # Add --reload in dev so uvicorn picks up code changes automatically.
    # Production's Dockerfile CMD does NOT include --reload (slow + leaks
    # workers under load).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]


  # -------------------------------------------------------------------------
  # postgres — the database server.
  # -------------------------------------------------------------------------
  postgres:
    # 17-alpine = Postgres 17 (current major) on Alpine Linux (~80 MB
    # image vs ~400 MB for the Debian-based postgres:17 tag). Pinned to
    # the major so a future Postgres 18 release doesn't silently change
    # behavior on a dev's machine.
    image: postgres:17-alpine

    container_name: yral-rishi-agent-new-service-template-postgres

    # Map host port 5432 so a dev can `psql -h localhost` from outside
    # the compose network. Prod never exposes this; the cluster's
    # Patroni handles connections via overlay only.
    ports:
      - "5432:5432"

    # Postgres reads these envs at first-init time to bootstrap the
    # superuser + the first database. Match the DATABASE_URL above.
    environment:
      POSTGRES_USER: service
      POSTGRES_PASSWORD: service-local-password
      POSTGRES_DB: service_local_database

    # Persist data across `docker compose down` so a dev doesn't lose
    # their local DB state on every restart.
    volumes:
      - postgres-data:/var/lib/postgresql/data

    # Compose waits for this to return success before starting dependents.
    # pg_isready runs a tiny TCP probe — much faster than running a real
    # SQL query.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service -d service_local_database"]
      interval: 3s
      timeout: 3s
      retries: 10


  # -------------------------------------------------------------------------
  # pgbouncer — the connection pooler between the service and Postgres.
  # -------------------------------------------------------------------------
  #
  # WHY PGBOUNCER IN LOCAL DEV?
  # Per CONSTRAINTS G3, pgBouncer is in the prod path. We run it locally
  # too so devs hit the same connection semantics during development
  # (avoids "works locally, breaks in prod" surprises around prepared
  # statements + transaction boundaries).
  #
  # SESSION MODE (local) vs TRANSACTION MODE (prod):
  # Session mode = one client connection maps 1:1 to one server connection.
  # No multiplexing, but no prepared-statement gotchas with asyncpg.
  # Transaction mode multiplexes but requires `statement_cache_size=0` on
  # the asyncpg side. We use session mode here for dev simplicity; prod
  # bouncer (in Session 1's stateful-core stack) uses transaction mode.
  # -------------------------------------------------------------------------
  pgbouncer:
    image: bitnami/pgbouncer:1.23.1

    container_name: yral-rishi-agent-new-service-template-pgbouncer

    environment:
      # Point the bouncer at the postgres container (by name) on its
      # native port. Bouncer listens on 6432 by default and forwards here.
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: service
      POSTGRESQL_PASSWORD: service-local-password
      POSTGRESQL_DATABASE: service_local_database

      # Allow the bouncer to authenticate clients with the same credentials.
      # In prod this lives in a Swarm secret; locally it's fine to set as
      # env (.env.local would normally hold it, but for the template we
      # ship a placeholder password).
      PGBOUNCER_AUTH_USER: service
      PGBOUNCER_DATABASE: service_local_database

      # Session mode for local dev — see header comment above.
      PGBOUNCER_POOL_MODE: session

    depends_on:
      postgres:
        condition: service_healthy


  # -------------------------------------------------------------------------
  # redis — cache + Streams + idempotency keys + feature flags.
  # -------------------------------------------------------------------------
  redis:
    # 7-alpine = Redis 7 (current major) on Alpine. Tiny image.
    image: redis:7-alpine

    container_name: yral-rishi-agent-new-service-template-redis

    # Map host port 6379 for dev convenience (`redis-cli` from outside).
    ports:
      - "6379:6379"

    # Persist Redis state across restarts via the appendonly-file mode.
    # Production uses Sentinel + replicas; local just snapshots to disk.
    command: ["redis-server", "--appendonly", "yes"]

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10


# ===========================================================================
# volumes — named persistent storage for the stateful containers.
# ===========================================================================
#
# Docker manages these on the host. `docker volume ls` shows them; they
# survive `docker compose down` but not `docker compose down -v`.
volumes:
  postgres-data:
  redis-data:


