# ===========================================================================
# shared-config.yaml — values shared across all 13 v2 services.
# ===========================================================================
#
# ⭐ START HERE: if a value is the same for EVERY v2 service (e.g. the
# Sentry host, the Langfuse host, the auth JWKS URL), it lives here.
# If a value differs PER SERVICE, it lives in `project.config`.
#
# WHY THIS FILE EXISTS
# CONSTRAINTS C7 says: "Maximum dynamism / no hardcoded values in code.
# Anything shared across services lives in one config that all services
# read." This file is that config.
#
# WHO READS THIS FILE?
# Every service's startup code (in the shared-library helper added Day 2).
# At service start, the helper loads this YAML once into an in-memory
# dict; everywhere in the codebase reads `shared_config.langfuse_host`
# instead of a hardcoded URL.
#
# WHY YAML (not project.config-style key=value)?
# Because shared values are often nested (e.g. `redis.sentinel_hosts` is
# a list of host:port pairs). YAML handles structure natively.
# project.config stays flat key=value because it's read by bash, CI, and
# Compose interpolation — all of which prefer simple env-style pairs.
#
# WHAT DOES NOT GO HERE?
#   - Secrets (those live in `secrets.yaml` + GitHub Secrets per D8)
#   - Per-service values (those live in `project.config`)
#   - Cluster-wide infra values like rishi-N IPs (those live in
#     `bootstrap-scripts-for-the-v2-docker-swarm-cluster/cluster.hosts.yaml`)
#
# HOW SERVICES STAY IN SYNC
# Each service folder has its OWN copy of this file (simpler than a
# symlink, friendlier to tooling). A CI lint (Day 3) verifies every
# service's copy matches the canonical version in
# `yral-rishi-agent-new-service-template/shared-config.yaml`. When a
# shared value needs to change, the template is edited once and a
# coordinator script (Day 3) propagates to every service folder.
#
# RELATED FILES (footer at the end).
# ===========================================================================


# ---------------------------------------------------------------------------
# Observability — Sentry self-hosted (per A7 + C4)
# ---------------------------------------------------------------------------
sentry:
  # The self-hosted Sentry endpoint EVERY v2 service reports to.
  # Per A7 + C4: it's sentry.rishi.yral.com (Rishi's self-hosted on
  # rishi-3), NEVER apm.yral.com (the team-shared instance). A7 has
  # been reinforced three separate times by Rishi.
  host: "https://sentry.rishi.yral.com"

  # Environment tag per D3. Override per environment via env var
  # SENTRY_ENVIRONMENT (set by docker-compose.yml in local;
  # docker-compose.swarm.yml in staging+production).
  environment_default: "production"


# ---------------------------------------------------------------------------
# Observability — Langfuse self-hosted (per D4)
# ---------------------------------------------------------------------------
langfuse:
  # The self-hosted Langfuse endpoint on rishi-6. Every LLM call from
  # every v2 service auto-traces here via the langfuse_middleware
  # (added Day 2).
  host: "https://langfuse.rishi.yral.com"

  # When false, the SDK no-ops (used locally to avoid noise + the
  # heavy ~1 GB stack). Override via env LANGFUSE_TRACING_ENABLED.
  tracing_enabled_default: true


# ---------------------------------------------------------------------------
# Auth — yral-auth-v2 (per E6)
# ---------------------------------------------------------------------------
auth:
  # JWKS URL the public-api middleware fetches keys from to validate
  # incoming JWTs. Per E6 + E9 (signature validation rolls out behind
  # a flag with dual-validate during shadow).
  jwks_url: "https://auth.yral.com/.well-known/jwks.json"

  # How long the resolved JWKS keys are cached in Redis. 1 hour per
  # E9. Long enough to avoid hammering auth.yral.com, short enough
  # that a key rotation propagates within the hour.
  jwks_cache_seconds: 3600

  # Default for the strict-validation feature flag (per E9). FALSE on
  # day 1 — matches current Python+Rust behavior where signature
  # validation is intentionally disabled. Flipped TRUE once the
  # dual-validate divergence rate is < 0.01% for 7 consecutive days.
  strict_jwt_signature_validation_default: false


# ---------------------------------------------------------------------------
# Billing — yral-billing (per E7)
# ---------------------------------------------------------------------------
billing:
  # The yral-billing service's pre-chat access-check endpoint.
  # Per E7: paywall is NOT a 402 HTTP response; it's
  # ApiResponse<ChatAccessDataDto{hasAccess, expiresAt}>.
  access_check_url: "https://api.yral.com/billing/google/chat-access/check"

  # Redis TTL for cached access decisions. 60 seconds per E7 — short
  # enough that a fresh IAP purchase is visible quickly, long enough
  # to absorb most repeat checks.
  access_cache_seconds: 60


# ---------------------------------------------------------------------------
# Database — shared Patroni cluster (per F3 + C9)
# ---------------------------------------------------------------------------
database:
  # The pgBouncer endpoint Session 1 deploys in the cluster stateful
  # core. All services point here, NOT directly at Patroni.
  pgbouncer_host: "pgbouncer.yral-v2-data-plane"
  pgbouncer_port: 6432

  # The Postgres database name on the shared cluster. Per F3 every
  # service uses its OWN schema inside this database; cross-schema
  # access is denied by role GRANTs.
  database_name: "yral_v2"

  # Disable asyncpg's server-side prepared statement cache so the
  # client works through pgBouncer in transaction mode without the
  # "prepared statement does not exist" error. Per F3 prod operation.
  asyncpg_statement_cache_size: 0


# ---------------------------------------------------------------------------
# Redis Sentinel HA (per C11)
# ---------------------------------------------------------------------------
redis:
  # The Sentinel master name. Sentinel-aware clients use this to
  # discover the current primary at connect time.
  sentinel_master_name: "yral-v2-redis-primary"

  # Sentinel quorum endpoints. Per C11: sentinels run on rishi-4/5/6.
  # The actual rishi-N IPs are resolved from the cluster's overlay
  # DNS (Session 1 sets this up).
  sentinel_hosts:
    - host: "redis-sentinel-1.yral-v2-data-plane"
      port: 26379
    - host: "redis-sentinel-2.yral-v2-data-plane"
      port: 26379
    - host: "redis-sentinel-3.yral-v2-data-plane"
      port: 26379

  # Default DB index for ephemeral keys (idempotency + feature flags +
  # access-check cache). Streams use a separate DB index per service
  # via project.config.
  ephemeral_db: 0


# ---------------------------------------------------------------------------
# Idempotency middleware (per F10)
# ---------------------------------------------------------------------------
idempotency:
  # Whether idempotency-key dedup is on by default for non-GET endpoints.
  # Per F10: default ON, per-endpoint opt-out for truly stateless routes.
  enabled_default: true

  # Redis TTL for dedup entries. 24 hours per F10.
  ttl_seconds: 86400


# ---------------------------------------------------------------------------
# Feature flags (per F11)
# ---------------------------------------------------------------------------
feature_flags:
  # Polling interval for the in-process flag cache. 30 seconds per F11.
  poll_seconds: 30


# ---------------------------------------------------------------------------
# LLM routing matrix (per A10)
# ---------------------------------------------------------------------------
llm:
  # Default archetype model when no per-influencer or is_nsfw rule applies.
  # Per A10 + F15: Gemini Flash for default, Claude for crisis.
  default_provider: "gemini"
  default_model: "gemini-2.0-flash"

  # NSFW route: per A10, influencer.is_nsfw=TRUE → OpenRouter to preserve
  # existing yral-chat-ai behavior.
  nsfw_provider: "openrouter"
  nsfw_model_default: "openrouter/auto"

  # Per E4: runaway-protection circuit-breaker cap, not a budget gate.
  # 500 INR per user per day; way above any normal user's spend; only
  # fires on clear abuse / bug cases.
  runaway_per_user_inr_per_day: 500


# ---------------------------------------------------------------------------
# Latency goals (per E1)
# ---------------------------------------------------------------------------
latency:
  # Per E1: v2 must be at least 50% faster than Python yral-chat-ai on
  # user-interactive endpoints. CI gate (Day 3) checks p95 against the
  # captured baseline.
  user_interactive_max_p95_ratio: 0.5

  # Per E2: SSE first-token target.
  streaming_first_token_max_p95_ms: 200


# ===========================================================================
# RELATED FILES (read these next):
#   project.config              — per-service values (PROJECT_NAME, etc.)
#   secrets.yaml.template       — per-service secret declarations
#   docker-compose.swarm.yml    — wires services to the values above
#   bootstrap-scripts-for-the-v2-docker-swarm-cluster/cluster.hosts.yaml
#                                — cluster-wide values (rishi-N hostnames)
# ===========================================================================
