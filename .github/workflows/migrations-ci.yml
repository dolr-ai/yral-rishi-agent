name: Migrations CI

# Phase 21αβ.I-Mig3 — apply every migration in order against an ephemeral
# Postgres on every PR + push to main. Catches the "migration has a
# syntax error / depends on out-of-order column / references missing
# extension" class of bug at PR time instead of at prod-apply time.
#
# Why pgvector/pgvector:pg15 not postgres:15: migration 008 does
# `CREATE EXTENSION IF NOT EXISTS vector` and that extension isn't in
# the stock Postgres image. The Spilo image V2 production runs has it,
# so we match that here.
#
# Idempotency IS tested (Phase 21αβ.I-Mig3 expansion, Rishi 2026-06-10):
# after the first apply, every migration runs a SECOND time, expecting
# each `psql -f` to exit 0. Catches plain CREATE TABLE / CREATE INDEX /
# ADD COLUMN without IF [NOT] EXISTS guards — those would crash on any
# replay (bootstrap workflow seeding state, manual psql, etc.).

on:
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - ".github/workflows/migrations-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "migrations/**"
      - ".github/workflows/migrations-ci.yml"

permissions:
  contents: read

jobs:
  apply-all-migrations:
    name: Apply all migrations in order
    runs-on: ubuntu-latest

    services:
      postgres:
        # pg15 matches V2 production (rishi-4/5/6 Patroni run pg15
        # under the Spilo image). pgvector pins to a tagged release —
        # `latest` would silently roll us forward.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yral_rishi_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: yral_rishi_agent_test

    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Wait for Postgres to be ready
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" > /dev/null 2>&1; then
              echo "Postgres ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres not ready after 30s"
          exit 1

      - name: Apply all migrations in lexicographic order
        # ON_ERROR_STOP makes psql exit non-zero on the first SQL
        # error — so a single broken migration fails CI loudly.
        # `! -name '*.down.sql'` mirrors the prod runner's filter.
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=$(find migrations -maxdepth 1 -name '*.sql' ! -name '*.down.sql' -type f | sort)
          if [ -z "$FILES" ]; then
            echo "no migrations to apply"
            exit 0
          fi
          COUNT=0
          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            echo "→ applying $(basename "$FILE")"
            psql -v ON_ERROR_STOP=1 -f "$FILE"
            COUNT=$((COUNT + 1))
          done <<< "$FILES"
          echo "✓ applied $COUNT migrations cleanly"

      - name: Sanity-check post-apply schema
        # Catches "migration applied but didn't create what it claimed".
        # The three critical tables are the V2 mobile contract floor —
        # if any of them is missing post-apply, the runtime can't boot.
        run: |
          set -euo pipefail
          for tbl in ai_influencers conversations messages; do
            count=$(psql -tAc "SELECT count(*) FROM information_schema.tables WHERE table_name = '$tbl';")
            if [ "$count" != "1" ]; then
              echo "FAIL: table '$tbl' missing after migrations applied"
              exit 1
            fi
            echo "✓ table $tbl present"
          done

      - name: Re-apply all migrations — idempotency check
        # Phase 21αβ.I-Mig3 extension (Rishi 2026-06-10): catch
        # migrations that don't use IF NOT EXISTS / IF EXISTS / WHERE NOT
        # IN — they'd crash on re-run, but our tracking-via-
        # schema_migrations means re-runs SHOULDN'T happen in prod.
        # When they DO happen (a bootstrap workflow seeding state, a
        # manual psql replay, a forgotten ALTER COLUMN behind a guard),
        # idempotent migrations stay safe; non-idempotent ones corrupt
        # state.
        #
        # This step reapplies every migration file against the already-
        # migrated DB. Expects each `psql -f` to exit 0:
        #   ✓ CREATE TABLE IF NOT EXISTS / CREATE INDEX IF NOT EXISTS /
        #     ADD COLUMN IF NOT EXISTS → re-runs as no-op.
        #   ✗ Plain CREATE TABLE / CREATE INDEX / ADD COLUMN without
        #     guards → fails second run with "already exists" error.
        #
        # Catching this at PR time prevents the corrupt-data scenarios
        # that the runner refusal path (#322 / 2026-06-09 incident)
        # exists to guard against in prod.
        run: |
          set -euo pipefail
          FILES=$(find migrations -maxdepth 1 -name '*.sql' ! -name '*.down.sql' -type f | sort)
          if [ -z "$FILES" ]; then
            echo "no migrations to re-apply"
            exit 0
          fi
          COUNT=0
          FAILED=0
          FAILED_LIST=""
          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            BASENAME=$(basename "$FILE")
            echo "→ re-applying $BASENAME (idempotency check)"
            # `set +e` for this one command so we can collect ALL
            # failures, not just the first, and report at the end.
            set +e
            psql -v ON_ERROR_STOP=1 -f "$FILE" > /tmp/reapply.out 2>&1
            RC=$?
            set -e
            if [ $RC -ne 0 ]; then
              echo "  ✗ $BASENAME is NOT idempotent (exit=$RC). psql output:"
              sed 's/^/    /' /tmp/reapply.out
              FAILED=$((FAILED + 1))
              FAILED_LIST="$FAILED_LIST $BASENAME"
            fi
            COUNT=$((COUNT + 1))
          done <<< "$FILES"
          echo
          if [ $FAILED -gt 0 ]; then
            echo "FAIL: $FAILED of $COUNT migrations are not idempotent:"
            for m in $FAILED_LIST; do echo "  - $m"; done
            echo
            echo "Fix: wrap CREATE TABLE in 'CREATE TABLE IF NOT EXISTS',"
            echo "     CREATE INDEX in 'CREATE INDEX IF NOT EXISTS',"
            echo "     ADD COLUMN in 'ADD COLUMN IF NOT EXISTS', etc."
            echo "     Non-idempotent migrations corrupt prod state if"
            echo "     replayed (manual psql, bootstrap workflow, etc.)."
            exit 1
          fi
          echo "✓ all $COUNT migrations are idempotent — second run was a no-op"

      - name: Verify schema unchanged by the re-apply
        # Belt-and-braces: even if the re-apply exits 0, a malformed
        # migration could silently mutate state (e.g. UPDATE with no
        # WHERE → harmless on empty test data but devastating on prod).
        # Snapshot the three floor tables' rowcounts before/after — they
        # must stay zero since the test DB is otherwise empty.
        run: |
          set -euo pipefail
          for tbl in ai_influencers conversations messages; do
            count=$(psql -tAc "SELECT count(*) FROM $tbl;")
            if [ "$count" != "0" ]; then
              echo "FAIL: re-apply put $count rows into '$tbl'"
              echo "  This means a migration has an UPDATE/INSERT outside an"
              echo "  IF NOT EXISTS guard that fires on every replay."
              exit 1
            fi
            echo "✓ $tbl unchanged (still empty)"
          done
