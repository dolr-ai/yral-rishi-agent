name: Security

# Phase 21αβ.I-Sec1 — gitleaks secret scan on every PR + push to main.
# Phase 21αβ.I-Sec2 — pip-audit dependency vuln scan, same triggers.
#
# Findings policy:
#   gitleaks  — any NEW finding fails CI. 4 baseline FPs allowlisted in
#               `.gitleaks.toml`. Future FPs extend that file in PRs.
#   pip-audit — strict mode, fails on any finding not in ignore-list.
#               The DEV-10 (2026-06-05) baseline of 14 known vulns is
#               in `pip-audit-ignore.txt` with a justification per CVE.
#
# We invoke the gitleaks BINARY directly (not gitleaks/gitleaks-action@v2
# which requires a paid license for organizations). Same scan coverage,
# zero $ cost. pip-audit is the official PyPA tool, free.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can sweep across all commits, not
          # just the PR's diff. Matches the manual `gitleaks detect
          # --log-opts="--all"` invocation from the DEV-7 audit baseline.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VERSION="8.30.1"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version
      - name: gitleaks detect (all history)
        # `--config .gitleaks.toml` picks up the allowlist baseline.
        # `--log-opts="--all"` scans every commit, not just HEAD.
        # `--exit-code 1` on findings (default), `0` on clean.
        # `--no-banner` keeps the CI log readable.
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --redact \
            --no-banner \
            --report-format json \
            --report-path gitleaks-report.json
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

  pip-audit:
    # Phase 21αβ.I-Sec2 — pip-audit on every PR + push to main.
    # Fails CI in strict mode on any finding not in the ignore-list.
    # DEV-10 (2026-06-05) established the baseline at 14 vulns across
    # pyjwt, python-multipart, starlette — all accepted-for-now and
    # listed in `pip-audit-ignore.txt` with a justification per CVE.
    name: pip-audit vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        # `--strict` fails on any finding NOT in the ignore-list.
        # We build the `--ignore-vuln` arguments from
        # `pip-audit-ignore.txt` (one ID per line, # for comments).
        # `--vulnerability-service osv` is the default; explicit so
        # the source is auditable.
        run: |
          IGNORE_ARGS=""
          while IFS= read -r line; do
            line="${line%%#*}"        # strip trailing # comments
            line="${line//[[:space:]]/}"  # strip whitespace
            [ -z "$line" ] && continue
            IGNORE_ARGS="$IGNORE_ARGS --ignore-vuln $line"
          done < pip-audit-ignore.txt
          echo "ignoring: $IGNORE_ARGS"
          pip-audit \
            -r requirements.txt \
            --vulnerability-service osv \
            --strict \
            --format json \
            --output pip-audit-report.json \
            $IGNORE_ARGS
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30
