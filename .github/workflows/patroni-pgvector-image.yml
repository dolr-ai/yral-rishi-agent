name: Patroni-pgvector image

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/scripts/Dockerfile.patroni-pgvector"
      - ".github/workflows/patroni-pgvector-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: bootstrap/scripts
          file: bootstrap/scripts/Dockerfile.patroni-pgvector
          push: true
          tags: |
            ghcr.io/dolr-ai/yral-rishi-patroni-pgvector:spilo-15-3.0-p1
            ghcr.io/dolr-ai/yral-rishi-patroni-pgvector:${{ github.sha }}
            ghcr.io/dolr-ai/yral-rishi-patroni-pgvector:latest
