name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pin ruff so a new release can't fail CI on pre-existing code (an
      # unpinned bump started flagging I001 in app/auth.py 2026-07-26).
      # The version lives in requirements-lint.txt so Dependabot can bump it
      # (it can't read a version out of a `run:` step); the RULE SET is pinned
      # in pyproject.toml [tool.ruff.lint], which is what makes a bump a no-op
      # rather than a semantic change. Keep in sync with what developers run.
      - run: pip install -r requirements-lint.txt
      - run: ruff check app/ infra/
      - run: ruff format --check app/ infra/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # requirements-test.txt adds testcontainers so the integration tests
      # under tests/integration/ run against a real pgvector Postgres. The
      # GitHub runner already has a Docker daemon for testcontainers to use.
      - run: pip install -r requirements.txt -r requirements-test.txt pytest
      - run: pytest tests/ -v
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"

  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dolr-ai/yral-rishi-agent:${{ github.sha }}
            ghcr.io/dolr-ai/yral-rishi-agent:latest
