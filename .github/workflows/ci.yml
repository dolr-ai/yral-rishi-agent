name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pin ruff so a new release can't fail CI on pre-existing code (an
      # unpinned bump started flagging I001 in app/auth.py 2026-07-26).
      # The version lives in requirements-lint.txt so Dependabot can bump it
      # (it can't read a version out of a `run:` step); the RULE SET is pinned
      # in pyproject.toml [tool.ruff.lint], which is what makes a bump a no-op
      # rather than a semantic change. Keep in sync with what developers run.
      - run: pip install -r requirements-lint.txt
      - run: ruff check app/ infra/
      - run: ruff format --check app/ infra/
      # Blocks NEW tests that assert against our own source as text
      # (`assert "def foo" in src` passes whether or not foo works).
      - run: python scripts/ci/check_source_text_assertions.py

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # requirements-test.txt adds testcontainers so the integration tests
      # under tests/integration/ run against a real pgvector Postgres. The
      # GitHub runner already has a Docker daemon for testcontainers to use.
      - run: pip install -r requirements.txt -r requirements-test.txt pytest
      # Coverage is a RATCHET, not a target. --cov-fail-under is a floor that
      # may rise and must never fall: it exists to stop backsliding, not to
      # chase a number (tests written to touch lines are how a suite ends up
      # 39% covered and still missing a 500 on its main path for four days).
      # Raise the floor in the PR that earns it. 40 is CI's real number
      # (40.06%): higher than a local run, because the integration tests need
      # Docker and skip on a laptop. Calibrate here, not from a local figure.
      - run: pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=41
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"

  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dolr-ai/yral-rishi-agent:${{ github.sha }}
            ghcr.io/dolr-ai/yral-rishi-agent:latest
