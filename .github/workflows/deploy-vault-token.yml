name: Deploy VAULT_TOKEN to swarm (one-shot)

# Manually triggered. Creates a new SHA8-suffixed swarm secret with the
# supplied Vault service token + attaches it to yral-rishi-agent's
# /run/secrets/vault_token mount. Same pattern as the bootstrap +
# patroni-roll workflows shipped 2026-06-09.
#
# Use case: Saikat (Vault admin) generates a periodic Vault token bound
# to a read-only policy for the secrets our service needs. Rishi passes
# it through this workflow as a masked input; the workflow does the
# create-secret + service-update dance so the token never lands on
# Rishi's laptop in cleartext.
#
# What this does NOT do:
# - Does NOT generate the Vault token itself — that's Saikat's domain
#   (Vault admin operations). Saikat creates a renewable/periodic token
#   bound to a least-privilege policy and sends the value securely.
# - Does NOT rotate the OTHER secrets attached to the service (Gemini,
#   OpenRouter, Postgres, etc.).

on:
  workflow_dispatch:
    inputs:
      vault_token:
        description: 'Vault service token from Saikat (will be SHA8-named + stored as a swarm secret).'
        required: true
      reason:
        description: 'Why are you deploying this token? (Audit trail.)'
        required: true
        default: 'Deploying Vault token because: '
      i_understand:
        description: 'Type DEPLOY VAULT TOKEN to confirm you understand this rolls the yral-rishi-agent service.'
        required: true
        default: ''

env:
  SWARM_STACK: yral-v2-patroni  # only used to locate a manager; the service we touch is yral-rishi-agent
  SERVICE: yral-rishi-agent
  SECRET_TARGET_NAME: vault_token
  SECRET_BASE_NAME: VAULT_TOKEN
  SWARM_MANAGER_1: 138.201.128.108
  SWARM_MANAGER_2: 88.99.160.251
  SWARM_MANAGER_3: 162.55.88.112
  SWARM_USER: rishi-deploy

jobs:
  deploy_token:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Confirm DEPLOY VAULT TOKEN typed
        run: |
          if [ "${{ inputs.i_understand }}" != "DEPLOY VAULT TOKEN" ]; then
            echo "::error::Confirmation phrase mismatched (must be exactly 'DEPLOY VAULT TOKEN'); aborting."
            exit 1
          fi
          echo "─── Vault token deploy initiated ───"
          echo "Triggered by:  ${{ github.actor }}"
          echo "Reason:        ${{ inputs.reason }}"
          echo "Timestamp:     $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Set up SSH key + known_hosts
        # ssh-keyscan picks up whichever host key algorithms each manager
        # offers (RSA + ED25519 + ECDSA). Same pattern as deploy.yml,
        # rollback.yml, bootstrap-schema-migrations.yml, roll-patroni-image.yml.
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for host in ${{ env.SWARM_MANAGER_1 }} ${{ env.SWARM_MANAGER_2 }} ${{ env.SWARM_MANAGER_3 }}; do
            ssh-keyscan -T 10 -H "$host" >> ~/.ssh/known_hosts 2>/dev/null || true
          done

      - name: Pick a responding swarm manager
        id: pick
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=yes"
          MGR=""
          for host in ${{ env.SWARM_MANAGER_1 }} ${{ env.SWARM_MANAGER_2 }} ${{ env.SWARM_MANAGER_3 }}; do
            if ssh $SSH_OPTS "${{ env.SWARM_USER }}@$host" "docker info --format '{{.Swarm.LocalNodeState}}' 2>/dev/null | grep -q active"; then
              MGR="$host"
              break
            fi
          done
          if [ -z "$MGR" ]; then
            echo "::error::No responding swarm manager"
            exit 1
          fi
          echo "Using swarm manager: $MGR"
          echo "mgr=$MGR" >> "$GITHUB_OUTPUT"

      - name: Create + attach VAULT_TOKEN swarm secret
        env:
          VAULT_TOKEN_VALUE: ${{ inputs.vault_token }}
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=yes"
          MGR="${{ steps.pick.outputs.mgr }}"
          TARGET="${{ env.SECRET_TARGET_NAME }}"
          BASE="${{ env.SECRET_BASE_NAME }}"
          SERVICE="${{ env.SERVICE }}"

          # SHA8 suffix on the swarm secret name. Lets us roll
          # forward without name collisions (swarm secrets are immutable).
          SHA8=$(printf '%s' "$VAULT_TOKEN_VALUE" | sha256sum | cut -c1-8)
          NEW_SECRET="${BASE}_${SHA8}"
          echo "New swarm secret name: $NEW_SECRET (target=$TARGET)"

          # Find the CURRENT secret attached at the same target (if any)
          # so we can detach it. Output is the swarm secret NAME (not
          # the target filename).
          CURRENT=$(ssh $SSH_OPTS "${{ env.SWARM_USER }}@$MGR" \
              "docker service inspect $SERVICE --format '{{range \$s := .Spec.TaskTemplate.ContainerSpec.Secrets}}{{if eq \$s.File.Name \"$TARGET\"}}{{\$s.SecretName}}{{end}}{{end}}' 2>/dev/null || true")
          echo "Current secret at /run/secrets/$TARGET: ${CURRENT:-<none>}"

          if [ "$CURRENT" = "$NEW_SECRET" ]; then
            echo "✓ Service already has $NEW_SECRET attached at /run/secrets/$TARGET — nothing to do."
            exit 0
          fi

          # Create the new swarm secret (idempotent — skip if exists).
          ssh $SSH_OPTS "${{ env.SWARM_USER }}@$MGR" "
            set -e
            if docker secret inspect '$NEW_SECRET' >/dev/null 2>&1; then
              echo '  swarm secret already exists — skipping create'
            else
              printf '%s' '$VAULT_TOKEN_VALUE' | docker secret create '$NEW_SECRET' -
              echo '  ✓ swarm secret created'
            fi
          "

          # Swap on the service: detach the old, attach the new.
          # `--secret-rm` is a no-op if the named secret isn't attached,
          # so we can pass the discovered $CURRENT even when it's empty.
          ATTACH_FLAGS="--secret-add source=$NEW_SECRET,target=$TARGET"
          if [ -n "$CURRENT" ] && [ "$CURRENT" != "$NEW_SECRET" ]; then
            DETACH_FLAGS="--secret-rm $CURRENT"
          else
            DETACH_FLAGS=""
          fi

          echo "── Updating $SERVICE: $DETACH_FLAGS $ATTACH_FLAGS ──"
          ssh $SSH_OPTS "${{ env.SWARM_USER }}@$MGR" \
              "docker service update $DETACH_FLAGS $ATTACH_FLAGS '$SERVICE'"

          echo "✓ Service updated. Container will re-roll picking up the new secret at /run/secrets/$TARGET"

      - name: Deploy summary
        run: |
          echo "─── Vault token deploy complete ───"
          echo "Secret is mounted at /run/secrets/${{ env.SECRET_TARGET_NAME }} inside the service container."
          echo "infra/vault.py reads from that path on first call (lru_cache)."
          echo "Next deploy or manual restart picks it up cleanly."
