name: Gate A2-PR Benchmark (E1 latency merge-blocker)

on:
  pull_request:
    branches: [main]
    paths:
      # Hot-path file filters — keep in sync with the Gate A2-PR section
      # in interface-contracts/01-internal-rpc-contracts.md. Any PR
      # touching these surfaces triggers the E1 latency gate.
      - 'yral-rishi-agent-public-api/**'
      - 'yral-rishi-agent-user-memory-service/**'
      - 'yral-rishi-agent-conversation-turn-orchestrator/app/**'
      - 'shared-library-code-used-by-every-v2-service/**'
      - '**/shared-config.yaml'
      - 'yral-rishi-agent-new-service-template/app/**'
      - 'yral-rishi-agent-new-service-template/pyproject.toml'
      - 'yral-rishi-agent-plan-and-discussions/latency-baseline-capture-from-live-services-the-numbers-v2-must-beat/daily-baseline.csv'
  workflow_dispatch:
    # Manual re-run capability for debugging; NOT the primary trigger.

permissions:
  contents: read

jobs:
  benchmark:
    name: Gate A2-PR — measure send-message p95 vs chat-ai baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Placeholder fail-by-design
        run: |
          # PLACEHOLDER: Session 1's benchmark script does not yet exist.
          # Once Session 1 lands the script at
          # latency-baseline-capture-from-live-services-the-numbers-v2-must-beat/scripts/run-gate-a2-pr-benchmark.py
          # (or similar), replace this step with a call to that script
          # and remove the explicit exit 1.
          #
          # Until then, this workflow FAILS BY DESIGN on every triggered
          # PR. That is intentional: per E1, the gate MUST exist before
          # the contract ratifies a hot-path architecture that depends on
          # it. PRs touching the hot path will block on this until
          # Session 1's script lands + this step is wired to it.
          #
          # Override path: until the script lands, coordinator override-
          # merges PRs touching the hot path with explicit Rishi YES per
          # the I10/I14 process trail (same pattern as PR #138 + PR #150
          # override-merges already documented).
          echo "::error::Gate A2-PR benchmark script NOT YET WRITTEN by Session 1."
          echo "::error::See interface-contracts/01-internal-rpc-contracts.md § 'Gate A2-PR' for the contract."
