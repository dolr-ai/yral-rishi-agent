name: Codex Review

on:
  pull_request:
    # ready_for_review is load-bearing, not decorative. A PR opened as a DRAFT
    # fires `opened` while draft, which the `if:` below correctly skips — and
    # clicking "Ready for review" fires ONLY `ready_for_review`. Without it in
    # this list, a draft-first PR is never reviewed at all unless the author
    # happens to push another commit afterwards (`synchronize`).
    #
    # That is not hypothetical: #501, #503 and #504 all show `skipped` here
    # because they were opened as drafts, so all three merged with no Codex
    # review — including #503, which would have 422'd every video generation
    # in the alpha app. deploy.yml auto-deploys on merge and names "Codex
    # review must pass" as one of the five safety nets that justify doing so,
    # so this gate silently not running is a hole in the deploy story.
    types: [opened, synchronize, ready_for_review]
    paths:
      - "app/**"
      - "infra/**"
      - "bootstrap/**"
      - ".github/workflows/**"
      - "migrations/**"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned, not bare `pip install openai`: this SDK went 1.x -> 3.x and
      # moved reviews onto the Responses API. An unpinned bump would change the
      # call surface under CI with no code change on our side — the same
      # failure the ruff pin exists to prevent (issue #505).
      - run: pip install openai==3.13.0
      - name: Run Codex review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_CODEX_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python .github/scripts/codex-review.py
