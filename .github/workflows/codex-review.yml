name: Codex Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get PR diff
        run: git diff origin/main...HEAD > /tmp/pr.diff
      - name: Run Codex review
        if: hashFiles('/tmp/pr.diff') != ''
        uses: openai/codex-review-action@v1
        with:
          diff-file: /tmp/pr.diff
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
