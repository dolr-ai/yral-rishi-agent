name: Rotate runpod_vllm bearer key on swarm

# Manually triggered. Reads the current value of GitHub Secret
# RUNPOD_VLLM_API_KEY, creates a new SHA8-suffixed swarm secret, swaps
# it onto yral-rishi-agent at /run/secrets/RUNPOD_VLLM_API_KEY. The
# service rolls a single task picking up the new secret value.
#
# Use case: Saikat hands Rishi a new bearer token for his vLLM
# serving (saikat-llm-medium-fast.yral.com). Rishi updates the GitHub
# Secret value, then triggers this workflow. The 4 background processes
# that route through runpod_vllm pick up the new key on the next
# request after the service rolls.
#
# Symmetric with bootstrap-schema-migrations.yml, roll-patroni-image.yml,
# and deploy-vault-token.yml (the earlier draft — replaced by this
# simpler approach since Saikat hands us the token directly).
#
# What this does NOT do:
# - Does NOT update the GitHub Secret value itself. That's a UI action
#   in the repo Settings → Secrets and variables → Actions. The
#   workflow assumes you've already pasted the new value there.
# - Does NOT roll the image. Only swaps the secret + restarts the
#   service tasks. The image stays the same.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you rotating? (Captured in run logs for the post-mortem.)'
        required: true
        default: 'Rotating runpod_vllm key because: '
      i_understand:
        description: 'Type ROTATE KEY to confirm you understand this restarts yral-rishi-agent tasks.'
        required: true
        default: ''

env:
  SERVICE: yral-rishi-agent
  SECRET_TARGET_NAME: RUNPOD_VLLM_API_KEY
  SECRET_BASE_NAME: RUNPOD_VLLM_API_KEY
  SWARM_MANAGER_1: 138.201.128.108
  SWARM_MANAGER_2: 88.99.160.251
  SWARM_MANAGER_3: 162.55.88.112
  SWARM_USER: rishi-deploy

jobs:
  rotate:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Confirm ROTATE KEY typed
        run: |
          if [ "${{ inputs.i_understand }}" != "ROTATE KEY" ]; then
            echo "::error::Confirmation phrase mismatched (must be exactly 'ROTATE KEY'); aborting."
            exit 1
          fi
          echo "─── runpod_vllm key rotation initiated ───"
          echo "Triggered by:  ${{ github.actor }}"
          echo "Reason:        ${{ inputs.reason }}"
          echo "Timestamp:     $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Verify GitHub Secret is set
        env:
          KEY_VALUE: ${{ secrets.RUNPOD_VLLM_API_KEY }}
        run: |
          if [ -z "$KEY_VALUE" ]; then
            echo "::error::GitHub Secret RUNPOD_VLLM_API_KEY is empty. Set it under repo Settings → Secrets and variables → Actions before triggering this workflow."
            exit 1
          fi
          # Length-only confirmation, never log the value itself.
          echo "✓ RUNPOD_VLLM_API_KEY present (length=${#KEY_VALUE})"

      - name: Set up SSH key + known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for host in ${{ env.SWARM_MANAGER_1 }} ${{ env.SWARM_MANAGER_2 }} ${{ env.SWARM_MANAGER_3 }}; do
            ssh-keyscan -T 10 -H "$host" >> ~/.ssh/known_hosts 2>/dev/null || true
          done

      - name: Pick a responding swarm manager
        id: pick
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=yes"
          MGR=""
          for host in ${{ env.SWARM_MANAGER_1 }} ${{ env.SWARM_MANAGER_2 }} ${{ env.SWARM_MANAGER_3 }}; do
            if ssh $SSH_OPTS "${{ env.SWARM_USER }}@$host" "docker info --format '{{.Swarm.LocalNodeState}}' 2>/dev/null | grep -q active"; then
              MGR="$host"
              break
            fi
          done
          if [ -z "$MGR" ]; then
            echo "::error::No responding swarm manager"
            exit 1
          fi
          echo "Using swarm manager: $MGR"
          echo "mgr=$MGR" >> "$GITHUB_OUTPUT"

      - name: Create new SHA8 swarm secret + swap on service
        env:
          KEY_VALUE: ${{ secrets.RUNPOD_VLLM_API_KEY }}
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=yes"
          MGR="${{ steps.pick.outputs.mgr }}"
          TARGET="${{ env.SECRET_TARGET_NAME }}"
          BASE="${{ env.SECRET_BASE_NAME }}"
          SERVICE="${{ env.SERVICE }}"

          # SHA8 suffix on the swarm secret name. Swarm secrets are
          # immutable so we can't update in place — must create new + swap.
          SHA8=$(printf '%s' "$KEY_VALUE" | sha256sum | cut -c1-8)
          NEW_SECRET="${BASE}_${SHA8}"
          echo "New swarm secret name: $NEW_SECRET (target=$TARGET)"

          # Discover the secret currently mounted at /run/secrets/$TARGET.
          # Output is the swarm secret NAME (e.g. RUNPOD_VLLM_API_KEY_abc12345),
          # not the target filename.
          CURRENT=$(ssh $SSH_OPTS "${{ env.SWARM_USER }}@$MGR" \
              "docker service inspect $SERVICE --format '{{range \$s := .Spec.TaskTemplate.ContainerSpec.Secrets}}{{if eq \$s.File.Name \"$TARGET\"}}{{\$s.SecretName}}{{end}}{{end}}' 2>/dev/null || true")
          echo "Current secret at /run/secrets/$TARGET: ${CURRENT:-<none>}"

          if [ "$CURRENT" = "$NEW_SECRET" ]; then
            echo "✓ Service already has $NEW_SECRET attached at /run/secrets/$TARGET — nothing to do."
            exit 0
          fi

          # Create the new swarm secret. The `printf '%s' "$KEY_VALUE"` is
          # SSH'd into the manager via stdin so the value never gets written
          # to disk on either runner or manager. Idempotent: skip if a
          # secret with the same name already exists (e.g. previous run
          # interrupted between create + service-update).
          ssh $SSH_OPTS "${{ env.SWARM_USER }}@$MGR" "
            set -e
            if docker secret inspect '$NEW_SECRET' >/dev/null 2>&1; then
              echo '  swarm secret already exists — skipping create'
            else
              printf '%s' '$KEY_VALUE' | docker secret create '$NEW_SECRET' -
              echo '  ✓ swarm secret created'
            fi
          "

          # Swap on the service spec. --secret-rm is only included when
          # there's an existing secret at the same target — otherwise
          # we'd pass an empty arg to the update command and it would fail.
          ATTACH_FLAGS="--secret-add source=$NEW_SECRET,target=$TARGET"
          if [ -n "$CURRENT" ] && [ "$CURRENT" != "$NEW_SECRET" ]; then
            DETACH_FLAGS="--secret-rm $CURRENT"
          else
            DETACH_FLAGS=""
          fi

          echo "── Updating $SERVICE: $DETACH_FLAGS $ATTACH_FLAGS ──"
          ssh $SSH_OPTS "${{ env.SWARM_USER }}@$MGR" \
              "docker service update --detach=false $DETACH_FLAGS $ATTACH_FLAGS '$SERVICE'"

          echo "✓ Service updated. Tasks re-rolled with new secret at /run/secrets/$TARGET"

      - name: Verify the 4 affected background processes
        run: |
          echo ""
          echo "─── Rotation complete ───"
          echo "New swarm secret deployed. The 4 background processes that"
          echo "route through runpod_vllm should recover within ~5 min:"
          echo "  - quality_scorer"
          echo "  - memory_extraction"
          echo "  - nudge_generation"
          echo "  - video_idea_generation"
          echo ""
          echo "Verify on the LLM-routing dashboard at:"
          echo "  https://agent.rishi.yral.com/admin/llm-routing"
