# squawk migration linter config
# Phase 21αβ.I-Mig2 — see .github/workflows/squawk.yml for context.
#
# `excluded_rules` lists rules we explicitly opt OUT of. Everything else
# in squawk's default set stays ON. This list is intentionally short so
# the surface area Rishi has to reason about is small.

excluded_rules = [
    # squawk's `prefer-text-field` flags VARCHAR(n) with a length cap.
    # The V2 schema uses VARCHAR(255) extensively (id columns, names).
    # The historical reasoning is fine for our usage — re-flagging
    # every VARCHAR would be noise without a real safety win.
    "prefer-text-field",

    # 2026-06-09 fix: previous versions of this file listed
    # `prefer-big-int` and `prefer-big-serial` here, but those rule
    # names do not exist in squawk's catalog — squawk fails-closed
    # ("Configuration error: invalid rule name ...") when an excluded
    # rule name is unknown, breaking the entire lint run for every PR
    # that touches a migration (PR #314 hit this). Our id columns are
    # explicitly VARCHAR-based (chat-ai contract), so neither
    # int-vs-bigint rule would fire on our migrations anyway — removed
    # rather than guessing the correct rule names.

    # `transaction-nesting` — our migration runner already wraps each
    # file in BEGIN/COMMIT (see scripts/ci/run-migrations.sh:111-117).
    # squawk's check for explicit transactions inside the file would
    # double-up and be inaccurate for our setup.
    "transaction-nesting",

    # `require-concurrent-index-creation` — structural conflict with
    # our migration runner. Postgres rejects `CREATE INDEX CONCURRENTLY`
    # inside a transaction block ("CREATE INDEX CONCURRENTLY cannot run
    # inside a transaction block"), and `scripts/ci/run-migrations.sh`
    # wraps every migration file in BEGIN/COMMIT for atomicity. We
    # accept a brief write-block during index creation in exchange for
    # transactional migration atomicity. The blocking duration is
    # bounded by our `lock_timeout = '5s'` runner default + `SET
    # lock_timeout = '3s'` declared at the top of every migration that
    # touches a populated table (per the I-Mig2 rule from PR #340).
    # First hit by PR #356's migration 035 (Coach PR-3 partial index
    # for the supersede transaction).
    "require-concurrent-index-creation",
]

# Per-rule overrides — none for now. If a future migration needs a
# specific waiver, add it here with a comment explaining WHY.
