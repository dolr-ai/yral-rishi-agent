# ===========================================================================
# secrets.yaml.template — per-service secrets MANIFEST template (per D8).
# ===========================================================================
#
# ⭐ START HERE: this file is the *template*. `scripts/new-service.sh`
# (Day 3) copies it into each spawned service folder as `secrets.yaml`
# and sed-substitutes yral-rishi-agent-conversation-turn-orchestrator with the new service's name.
#
# WHAT IS A "SECRETS MANIFEST"?
# A declaration of every secret THIS service needs. Each entry has
# metadata (description, source-per-env, rotation policy, what code
# files consume it, blast-radius classification) but NEVER the secret
# value itself. Values live in:
#   - `.env.local` for local development (gitignored)
#   - GitHub Secrets for CI
#   - Swarm secrets (mounted as files at /run/secrets/) for production
# Per CONSTRAINTS D1: per-service production secrets flow GitHub Secret
# → Swarm secret at deploy → env var / file at container start.
# Vault is for cross-service shared secrets ONLY.
#
# WHY MANIFEST + BRIDGE SCRIPTS (per D8)?
#   - `scripts/validate-secrets.sh` reads this and verifies every required
#     secret has a value in every required env (fails CI if missing).
#   - `scripts/sync-github-secrets.sh` reads this and interactively
#     populates missing GitHub Secrets via `gh secret set`.
#   - `scripts/gen-env-example.sh` reads this and regenerates
#     `.env.example` so devs can `cp .env.example .env.local` and see
#     every variable they need to fill in.
#
# SCHEMA (full reference in
# yral-rishi-agent-plan-and-discussions/secrets-management-pattern-
# for-every-v2-service/01-secrets-yaml-schema-and-example.md):
#
#   service: <service-name>
#   secrets:
#     - name: SECRET_NAME              # UPPER_SNAKE_CASE per B1
#       description: |
#         One-sentence plain-English explanation.
#       required_in: [local, ci, production]
#       source:
#         local: ".env.local"
#         ci: "GitHub Secret <SECRET_NAME>"
#         production: "GitHub Secret <SECRET_NAME> → Swarm secret at deploy"
#       rotation_policy: "every X days" or "stable" or "rotated when ..."
#       consumed_by:
#         - app/some_file.py
#       classification:
#         blast_radius: low|medium|high
#         access_pattern: read|write|admin
#       notes: |
#         Optional extra context.
#
# THE FIVE SECRETS BELOW ARE THE INHERITANCE — every service spawned
# from this template starts with them. Service-specific secrets (JWT
# JWKS URL, OPENROUTER_API_KEY, etc.) get added per service as needed.
#
# RELATED FILES (footer at the end).
# ===========================================================================

# Replaced by new-service.sh with the spawned service's name.
service: yral-rishi-agent-conversation-turn-orchestrator

secrets:

  # -------------------------------------------------------------------------
  # REDIS_URL — Redis connection string (F10 idempotency dedup; C11 HA).
  # -------------------------------------------------------------------------
  #
  # Day-7 deploy alignment (per Session-3 PR-#108 + the runtime audit):
  # orchestrator's code reads `settings.redis_url` (env: REDIS_URL),
  # NOT a separate `REDIS_SENTINEL_PASSWORD`. Password is embedded in
  # the URL when present (`redis://:password@host:port/db` form per
  # the redis-py from_url contract). Renamed for D8 manifest-to-code
  # alignment.
  - name: REDIS_URL
    description: |
      Redis connection string used by the F10 idempotency-dedup layer
      (`app/idempotency.py`) + the Sentinel-aware client when
      `REDIS_SENTINEL_ENABLED=true`. Format:
        redis://:<password>@<host>:6379/0
      Per C11 the cluster's HA Redis runs Sentinel quorum on
      rishi-4/5/6; password embedded in the URL.
    required_in: [local, ci, production]
    source:
      local: ".env.local (local docker-compose Redis can use 'devpassword' or empty)"
      ci: "GitHub Secret REDIS_URL"
      production: "GitHub Secret REDIS_URL → Swarm secret at deploy"
    rotation_policy: "every 180 days"
    consumed_by:
      - app/idempotency.py
    classification:
      blast_radius: medium
      access_pattern: read+write
    notes: |
      Per-service Redis ACL (Session 1's stateful-core stack) limits
      each service to its own key prefix; a leak only exposes this
      service's keys, not the cluster's.
      DATABASE_URL trimmed at Day-7 deploy time: orchestrator is a
      thin HTTP service (RPC to soul-file-library + Gemini SDK; no
      direct asyncpg consumer). Same trim Session 3 applied to
      public-api in PR-#108. Re-adds the day a future feature needs
      direct DB access.

  # -------------------------------------------------------------------------
  # REDIS_PASSWORD — AUTH credential sent in response to Redis primary's
  # `--requirepass` challenge after Sentinel discovery (per H3 +
  # 2026-05-22 incident-response rotation).
  # -------------------------------------------------------------------------
  - name: REDIS_PASSWORD
    description: |
      Password sent to the Redis primary in response to its AUTH
      challenge. The v2 cluster's Redis primary runs with
      `--requirepass` enabled; every connection to the primary
      MUST AUTH or first command raises
      `redis.exceptions.AuthenticationError: Authentication required.`
      Consumed by `app/idempotency.py`'s Sentinel `master_for(...)`
      call when `REDIS_SENTINEL_ENABLED=true`. Local dev's
      docker-compose Redis is unauthenticated so this secret stays
      empty there.
    required_in: [ci, production]
    source:
      local: "Not required — local docker-compose Redis runs without --requirepass"
      ci: "GitHub Secret REDIS_PASSWORD"
      production: "Swarm secret yral_v2_redis_primary_password_<sha> mapped to logical name REDIS_PASSWORD via compose external:name"
    rotation_policy: "Every 180 days, or on incident response (e.g. 2026-05-22 leak rotation)"
    consumed_by:
      - app/idempotency.py
    classification:
      blast_radius: medium
      access_pattern: read-only
    notes: |
      Rotation pattern: create new versioned Swarm secret
      `yral_v2_redis_primary_password_<new-sha>`, then rolling-update
      ALL 5 Redis-stack services simultaneously (primary + replica +
      3 sentinels) to mount the new secret at target name
      `redis-primary-password`, verify Redis cluster healthy
      (sentinel quorum + replica `master_link_status:up` + no
      FAILOVER events), then update each consumer's
      docker-compose.swarm.yml `external: name:` mapping to point at
      the new versioned secret + roll the consumer service, then
      drop the old secret last. Full HA-safe sequence lives in
      `bootstrap-scripts-for-the-v2-docker-swarm-cluster/secrets-
      manifest.yaml`'s `REDIS_PRIMARY_PASSWORD` entry's
      `rotation_runbook` (the cluster-level manifest is the source
      of truth; consumer manifests reference it, not duplicate it).
      Earlier draft of these notes referenced "ALTER ROLE on
      Patroni" — that's a Postgres operation, NOT a Redis one;
      corrected here per Codex CONCERN on PR #136 round-2 + the
      coordinator-side correction in PR #138.

  # -------------------------------------------------------------------------
  # SENTRY_DSN — error tracking destination (per A7 + D3).
  # -------------------------------------------------------------------------
  - name: SENTRY_DSN
    description: |
      Sentry DSN for THIS service's project at sentry.rishi.yral.com
      (NOT apm.yral.com per A7). The middleware (added Day 2) auto-tags
      every event with service=yral-rishi-agent-conversation-turn-orchestrator per D3.
    required_in: [local, ci, production]
    source:
      local: ".env.local (use a dev Sentry project so local errors don't pollute prod)"
      ci: "GitHub Secret SENTRY_DSN"
      production: "GitHub Secret SENTRY_DSN → Swarm secret at deploy"
    rotation_policy: "stable; rotates only if Sentry org migrates"
    consumed_by:
      - app/sentry_middleware.py
    classification:
      blast_radius: low
      access_pattern: write-only
    notes: |
      Sentry DSNs are write-only by design — a leaked DSN lets an
      attacker submit fake events, but not read existing ones.

  # -------------------------------------------------------------------------
  # LANGFUSE_PUBLIC_KEY — LLM trace ingestion key (per D4).
  # -------------------------------------------------------------------------
  - name: LANGFUSE_PUBLIC_KEY
    description: |
      Langfuse project public key. Identifies which Langfuse project the
      service's LLM traces land in. Paired with LANGFUSE_SECRET_KEY.
      Per D4 every service auto-traces LLM calls to langfuse.rishi.yral.com.
    required_in: [local, ci, production]
    source:
      local: ".env.local (optional — LANGFUSE_TRACING_ENABLED=false locally avoids needing real keys)"
      ci: "GitHub Secret LANGFUSE_PUBLIC_KEY"
      production: "GitHub Secret LANGFUSE_PUBLIC_KEY → Swarm secret at deploy"
    rotation_policy: "every 180 days"
    consumed_by:
      - app/langfuse_middleware.py
    classification:
      blast_radius: low
      access_pattern: write-only
    notes: |
      Public key is half of the auth pair; needs the secret key to do anything.

  # -------------------------------------------------------------------------
  # LANGFUSE_SECRET_KEY — LLM trace ingestion secret (per D4).
  # -------------------------------------------------------------------------
  - name: LANGFUSE_SECRET_KEY
    description: |
      Langfuse project secret key. Paired with LANGFUSE_PUBLIC_KEY. The
      SDK signs every trace-ingestion call with this key.
    required_in: [local, ci, production]
    source:
      local: ".env.local (optional — see LANGFUSE_PUBLIC_KEY above)"
      ci: "GitHub Secret LANGFUSE_SECRET_KEY"
      production: "GitHub Secret LANGFUSE_SECRET_KEY → Swarm secret at deploy"
    rotation_policy: "every 180 days; rotate alongside LANGFUSE_PUBLIC_KEY"
    consumed_by:
      - app/langfuse_middleware.py
    classification:
      blast_radius: medium
      access_pattern: write-only
    notes: |
      A leak only lets an attacker ingest fake traces; no read access.

  # -------------------------------------------------------------------------
  # GEMINI_API_KEY — Google Gemini LLM provider auth (Day-5, per D8 + A10).
  # -------------------------------------------------------------------------
  - name: GEMINI_API_KEY
    description: |
      Auth key for the Google Gemini API. Used by `app/llm_client/gemini.py`
      to generate assistant replies on the default-tier path (per the
      Session-4 agent definition's Day-5 plan: "default → Gemini Flash";
      Tara → OpenRouter routing lands Day 6+). Per A10 every LLM call
      runs through the abstract `LlmClient` interface; this secret only
      reaches the Gemini provider.
    required_in: [ci, production]
    source:
      local: ".env.local (use a personal Google AI Studio key for laptop testing; or leave empty + the gemini provider refuses to init)"
      ci: "GitHub Secret GEMINI_API_KEY"
      production: "GitHub Secret GEMINI_API_KEY → Swarm secret at deploy"
    rotation_policy: "every 90 days; rotate via Google AI Studio console"
    consumed_by:
      - app/llm_client/gemini.py
    classification:
      blast_radius: high
      access_pattern: write-only-from-our-side
    notes: |
      Quota lives at the project level in Google Cloud; a leaked key
      lets an attacker burn our quota + run up bill, but not read prior
      requests (Gemini API is request-scoped — no history surface).
      Day 6+ adds OPENROUTER_API_KEY + ANTHROPIC_API_KEY alongside per
      the routing matrix.


