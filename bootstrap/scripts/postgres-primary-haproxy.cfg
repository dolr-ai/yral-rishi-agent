# postgres-primary — always forwards to whichever Patroni copy is the leader.
#
# Copies come and go with the fleet, so the member list is not written here:
# HAProxy re-reads `tasks.patroni` from swarm DNS every few seconds and fills
# up to 9 slots with whatever it finds. Patroni's REST API answers 200 on
# /primary only on the leader; everything else is marked down, and open
# connections to a copy that stops being leader are cut so apps reconnect.

global
    maxconn 4000

defaults
    mode tcp
    timeout connect 5s
    timeout client 30m
    timeout server 30m
    timeout check 3s

resolvers swarm
    nameserver docker 127.0.0.11:53
    accepted_payload_size 8192
    hold valid 5s
    hold obsolete 10s

listen primary
    bind :5432
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server-template member 9 tasks.patroni:5432 check port 8008 resolvers swarm init-addr none
