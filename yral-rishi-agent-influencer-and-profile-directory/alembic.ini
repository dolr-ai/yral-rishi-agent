# ===========================================================================
# alembic.ini — Alembic schema-migration tool config for the
# influencer-and-profile-directory service.
# ===========================================================================
#
# ⭐ START HERE: this file points Alembic at `app/migrations/` for migration
# scripts and reads the database connection string from the
# `POSTGRES_CONNECTION_STRING_INFLUENCER_AND_PROFILE_DIRECTORY` env var (the
# per-service secret declared in `secrets.yaml` per D8). Alembic itself is
# invoked via `alembic upgrade head` (apply all migrations) or `alembic
# downgrade base` (revert all migrations) from this service's folder.
#
# WHY NO INLINE DATABASE URL?
# Per D1 + D8 — secrets NEVER live in committed files. The connection
# string is read at runtime from the env in `app/migrations/env.py`, not
# from this file. The `sqlalchemy.url` line below is intentionally empty so
# a misread of this config (e.g. accidentally running it without the env
# var set) fails fast rather than silently connecting to a default
# localhost db.
#
# RELATED FILES (footer at end).
# ===========================================================================

[alembic]
# Directory containing migration scripts. Alembic auto-discovers
# `versions/` under this path.
script_location = app/migrations

# Empty here — `env.py` builds the URL from
# POSTGRES_CONNECTION_STRING_INFLUENCER_AND_PROFILE_DIRECTORY at runtime.
# Fails fast if the env var is missing.
sqlalchemy.url =

# Path separator + timezone for revision filenames.
timezone = UTC

# Migration filename template — keeps Alembic's auto-generated naming
# consistent across services.
file_template = %%(rev)s_%%(slug)s


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# ===========================================================================
# RELATED FILES:
#   app/migrations/env.py           — reads the env var + builds AsyncEngine
#   app/migrations/versions/        — the actual migration scripts
#   secrets.yaml                    — declares the env var per D8
#   docker-compose.swarm.yml        — mounts the Swarm secret in production
# ===========================================================================
