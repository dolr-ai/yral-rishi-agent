# ---------------------------------------------------------------------------
# docker-compose.yml — local development stack for the user-memory-service.
#
# ⭐ START HERE:
#   1. `services:` lists: the service itself, Postgres, pgBouncer.
#   2. Run `docker compose up --build` from this folder to get a
#      self-contained dev environment on your laptop.
#   3. Service is reachable at http://localhost:8000.
#   4. Run `alembic upgrade head` once after first `docker compose up`
#      to create the conversations + messages tables.
#
# DIFFERENCE FROM PRODUCTION (docker-compose.swarm.yml):
#   Local: deps run as sibling containers, host ports exposed for dev.
#   Swarm: Postgres + pgBouncer owned by cluster, no host ports per C3.
#
# WHY NO REDIS IN THIS SERVICE?
# Phase 1 (conversation history persistence) uses Postgres only — no
# idempotency-key Redis cache, no feature-flag Redis table yet.
# Redis gets added in Deliverable 2+ if needed (per A2.1 — don't add
# infrastructure until a consumer needs it).
#
# RELATED FILES (footer at end).
# ---------------------------------------------------------------------------

services:

  # -------------------------------------------------------------------------
  # service — the FastAPI app itself.
  # -------------------------------------------------------------------------
  service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: yral-rishi-agent-user-memory-service

    ports:
      - "8000:8000"

    environment:
      # Per D8: env-var name includes service suffix (_USER_MEMORY_SERVICE)
      # for unambiguous blast-radius identification.
      # Port 6432 = pgBouncer (not raw Postgres at 5432) — local dev
      # exercises the same connection-pooling path prod uses.
      POSTGRES_CONNECTION_STRING_USER_MEMORY_SERVICE: postgresql://service:service-local-password@pgbouncer:6432/service_local_database

      # Empty locally — SDK no-ops. Set to sentry.rishi.yral.com DSN in prod.
      SENTRY_DSN: ""

      # Off locally — set to "true" + provide keys for Langfuse tracing.
      LANGFUSE_TRACING_ENABLED: "false"

      # local / staging / production — controls log formatting + Sentry env tag.
      ENVIRONMENT: local

    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started

    # Mount the app source as a volume in dev so code changes don't need
    # a full rebuild — uvicorn[standard] auto-reloads via watchfiles.
    volumes:
      - ./app:/app/app:ro

    # --reload flag in dev for auto-reload on file change.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]


  # -------------------------------------------------------------------------
  # postgres — the database server.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine

    container_name: yral-rishi-agent-user-memory-service-postgres

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: service
      POSTGRES_PASSWORD: service-local-password
      POSTGRES_DB: service_local_database

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service -d service_local_database"]
      interval: 3s
      timeout: 3s
      retries: 10


  # -------------------------------------------------------------------------
  # pgbouncer — connection pooler between the service and Postgres.
  # Per CONSTRAINTS G3, pgBouncer is in the prod path. Run it locally
  # too so devs hit the same connection semantics as prod (avoids
  # "works locally, breaks in prod" surprises around prepared statements).
  # -------------------------------------------------------------------------
  pgbouncer:
    # edoburu/pgbouncer pinned by digest — same pattern as soul-file-library.
    image: edoburu/pgbouncer@sha256:85d1e38593617af1b5f7f285e97d407e56c29939683cc7cfe4c8f6dc19f1268b

    container_name: yral-rishi-agent-user-memory-service-pgbouncer

    ports:
      - "6432:6432"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: service
      DB_PASSWORD: service-local-password
      DB_NAME: service_local_database
      LISTEN_PORT: 6432
      AUTH_TYPE: trust
      POOL_MODE: session

    depends_on:
      postgres:
        condition: service_healthy


# ===========================================================================
# volumes — named persistent storage for the stateful containers.
# ===========================================================================
volumes:
  postgres-data:


# ===========================================================================
# RELATED FILES:
#   Dockerfile               — image the `service` container is built from
#   docker-compose.swarm.yml — prod analogue (overlay-only, no host ports)
#   pyproject.toml           — Python deps installed in the service image
#   project.config           — per-service runtime values
# ===========================================================================
