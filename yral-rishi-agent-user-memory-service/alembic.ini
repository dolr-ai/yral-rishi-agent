# ===========================================================================
# alembic.ini — Alembic schema-migration tool config for user-memory-service.
# ===========================================================================
#
# ⭐ START HERE: this file points Alembic at `app/migrations/` for migration
# scripts and reads the database connection string from the
# POSTGRES_CONNECTION_STRING_USER_MEMORY_SERVICE env var (the per-service
# secret declared in `secrets.yaml` per D8).
# Alembic is invoked via `alembic upgrade head` (apply all pending
# migrations) or `alembic downgrade base` (revert all migrations).
#
# WHY NO INLINE DB URL?
# Per D1 + D8 — secrets NEVER live in committed files. The connection
# string is read at runtime from the env in `app/migrations/env.py`,
# not from this file. The `sqlalchemy.url` line below is intentionally
# empty so a misread of this config fails fast rather than silently
# connecting to a default localhost db.
#
# RELATED FILES (footer at end).
# ===========================================================================

[alembic]
# Directory containing migration scripts. Alembic auto-discovers
# `versions/` under this path.
script_location = app/migrations

# Empty here — `env.py` builds the URL from
# POSTGRES_CONNECTION_STRING_USER_MEMORY_SERVICE at runtime.
# Fails fast if the env var is missing.
sqlalchemy.url =

# Use a hash-only revision identifier (12-char prefix). Short filenames +
# the % slug suffix makes the chain order obvious at `ls`-time while
# keeping filenames greppable.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S


# ===========================================================================
# RELATED FILES:
#   app/migrations/env.py        — reads POSTGRES_CONNECTION_STRING_USER_MEMORY_SERVICE
#                                   + builds the async SQLAlchemy engine
#   app/migrations/versions/     — individual migration scripts
#   secrets.yaml                 — declares the connection-string secret per D8
#   docker-compose.yml           — local Postgres + pgbouncer pair
#   tests/conftest.py            — testcontainers-postgres used for CI
# ===========================================================================
