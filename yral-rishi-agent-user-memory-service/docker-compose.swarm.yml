# ---------------------------------------------------------------------------
# docker-compose.swarm.yml — the production Swarm-stack variant.
#
# ⭐ START HERE:
#   1. This deploys the SERVICE ONLY into the running Swarm cluster.
#   2. Postgres + pgBouncer are owned by Session 1's cluster stateful-core
#      stack — this service connects to them via overlay networks.
#   3. Deploy: `docker stack deploy -c docker-compose.swarm.yml <name>`
#
# DIFFERENCE FROM docker-compose.yml:
#   - No `build:` — Swarm pulls a pre-built image from GHCR (per F13).
#   - No `ports:` — only the edge Caddy stack publishes 443 (per C3).
#   - `deploy:` block — replica count, rolling update, placement, resources.
#   - `secrets:` — Swarm-managed secrets, never env vars in this file (D1).
#   - `networks:` — three encrypted overlays per C3.
#
# PER-SERVICE POSTGRES PROVISIONING (required before deploying):
# The `user_memory_role` Postgres role + `user_memory` database MUST be
# provisioned on the Patroni cluster before this stack deploys, per F3.
# This is a coordinator / Session 1 operator action (see DEP-011 in
# cross-session-dependencies.md). Without it the asyncpg pool will fail
# to connect on startup.
#
# RELATED FILES (footer at end).
# ---------------------------------------------------------------------------

version: "3.9"

services:

  service:
    # Image from GHCR (per F13). CI exports IMAGE_REPO + IMAGE_TAG.
    # Both must be set — no default (a missing tag must NEVER fall back
    # to "latest").
    image: ${IMAGE_REPO}:${IMAGE_TAG}

    environment:
      # ENVIRONMENT controls log formatting + Sentry env tag. Note:
      # per fix PR #125 pattern (fixing "production → staging" regression)
      # dev cluster should use ENVIRONMENT=staging, not production.
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    # Secret-file → env-var bridge per D8 (PR #108 / PR #116 pattern).
    # Swarm mounts each secret as a file at /run/secrets/<name>;
    # pydantic-settings reads from os.environ — this wrapper exports
    # each `/run/secrets/*` file's content as an env var of the same
    # name, then execs uvicorn.
    command:
      - sh
      - -c
      - |
        for s in /run/secrets/*; do
          if [ -f "$$s" ]; then
            export "$$(basename "$$s")=$$(cat "$$s")"
          fi
        done
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000

    deploy:
      # 3 replicas per G2 (horizontal scale from day 1).
      replicas: 3

      # Rolling update: replace one replica at a time so a bad deploy
      # can be caught before all 3 are down.
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 30s

      # Auto-rollback on deploy failure per I2.
      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first

      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

      restart_policy:
        condition: any
        max_attempts: 3
        window: 60s

      # Caddy Swarm plugin auto-routes public traffic via these labels.
      labels:
        - "caddy=${PROJECT_DOMAIN}"
        - "caddy.reverse_proxy={{upstreams 8000}}"

    # Health check — uses Python stdlib urllib (slim image has no curl).
    # start_period=40s per PR #108 lesson: app boot + asyncpg pool init
    # shouldn't race the first healthcheck on cold cluster startup.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2).status == 200 else sys.exit(1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 40s

    networks:
      - yral-v2-public-web
      - yral-v2-internal
      - yral-v2-data-plane

    # Secrets per D8 manifest (secrets.yaml is source of truth).
    # uid/gid 1001 so the non-root appuser can read the mounted files.
    secrets:
      - source: POSTGRES_CONNECTION_STRING_USER_MEMORY_SERVICE
        target: POSTGRES_CONNECTION_STRING_USER_MEMORY_SERVICE
        uid: "1001"
        gid: "1001"
        mode: 0400
      - source: SENTRY_DSN
        target: SENTRY_DSN
        uid: "1001"
        gid: "1001"
        mode: 0400
      - source: LANGFUSE_PUBLIC_KEY
        target: LANGFUSE_PUBLIC_KEY
        uid: "1001"
        gid: "1001"
        mode: 0400
      - source: LANGFUSE_SECRET_KEY
        target: LANGFUSE_SECRET_KEY
        uid: "1001"
        gid: "1001"
        mode: 0400


# ===========================================================================
# networks — overlay networks this service attaches to (per C3).
# ===========================================================================
# `external: true` — created by Session 1's cluster-bootstrap scripts.
# This service does NOT create them; deploy fails with a clear error if
# they don't exist yet.
networks:
  yral-v2-public-web:
    external: true
  yral-v2-internal:
    external: true
  yral-v2-data-plane:
    external: true


# ===========================================================================
# secrets — references to Swarm-managed secrets (external).
# ===========================================================================
# Created by Session 1's bootstrap or `docker secret create` out-of-band.
# Declaring external means Swarm verifies their existence at deploy time.
secrets:
  POSTGRES_CONNECTION_STRING_USER_MEMORY_SERVICE:
    external: true
  SENTRY_DSN:
    external: true
  LANGFUSE_PUBLIC_KEY:
    external: true
  LANGFUSE_SECRET_KEY:
    external: true


# ===========================================================================
# RELATED FILES:
#   Dockerfile               — produces the image GHCR ships
#   docker-compose.yml       — local dev variant
#   pyproject.toml           — runtime deps baked into the image
#   project.config           — IMAGE_REPO + PROJECT_DOMAIN + env values
#   secrets.yaml             — source of truth for the secrets block
#   bootstrap-scripts-for-the-v2-docker-swarm-cluster/
#                             — Session 1's stateful-core + overlay setup
# ===========================================================================
