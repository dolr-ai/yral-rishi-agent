# ===========================================================================
# secrets.yaml — per-service secrets MANIFEST for user-memory-service (D8).
# ===========================================================================
#
# ⭐ START HERE: this file declares every secret THIS service needs.
# Each entry has metadata (description, source per env, rotation policy,
# which code files consume it, blast-radius classification) but NEVER
# the secret VALUE itself. Values live in:
#   - `.env.local` for local development (gitignored)
#   - GitHub Secrets for CI
#   - Swarm secrets (mounted as files at /run/secrets/) for production
#
# Per CONSTRAINTS D1: per-service production secrets flow:
#   GitHub Secret → Swarm secret at deploy → env var at container start.
#
# WHY THE SERVICE-NAME SUFFIX IN THE SECRET NAME?
# Per D8 verbatim: "the secret name carries the service-name suffix
# (`_USER_MEMORY_SERVICE`) so a leaked secret is unambiguous about which
# service's blast-radius applies." A leaked connection string clearly
# affects only user-memory-service, not the whole cluster.
#
# RELATED FILES (footer at end).
# ===========================================================================

service: yral-rishi-agent-user-memory-service

secrets:

  # -------------------------------------------------------------------------
  # POSTGRES_CONNECTION_STRING_USER_MEMORY_SERVICE — DB connection (per D8).
  # -------------------------------------------------------------------------
  - name: POSTGRES_CONNECTION_STRING_USER_MEMORY_SERVICE
    description: |
      Postgres connection string the user-memory-service uses to reach its
      OWN schema on the shared Patroni cluster. asyncpg-compatible format:
        postgresql://${POSTGRES_ROLE}:<password>@<pgbouncer-host>:6432/yral_v2?options=-csearch_path%3D${POSTGRES_SCHEMA}
      Per F3 the cluster is shared but each service is restricted to its
      own schema via Postgres role GRANTs. Per G3 traffic goes through
      pgBouncer. Per D8 the secret name carries the service-name suffix
      (`_USER_MEMORY_SERVICE`) for unambiguous blast-radius identification.
      PROVISIONING REQUIRED: the `user_memory_role` Postgres role + the
      `user_memory` database on the Patroni cluster must be created by the
      coordinator / Session 1 before this secret is meaningful.
      See DEP-011 in cross-session-dependencies.md.
    required_in: [local, ci, production]
    source:
      local: ".env.local (point at the local docker-compose Postgres+pgbouncer pair)"
      ci: "GitHub Secret POSTGRES_CONNECTION_STRING_USER_MEMORY_SERVICE"
      production: "GitHub Secret POSTGRES_CONNECTION_STRING_USER_MEMORY_SERVICE → Swarm secret at deploy"
    rotation_policy: "every 90 days; coordinated with Patroni role-password rotation"
    consumed_by:
      - app/database.py
      - app/migrations/env.py
    classification:
      blast_radius: high
      access_pattern: read+write
    notes: |
      Per-service schema means a leaked connection string only exposes
      THIS service's data (conversations + messages), not the whole cluster.
      Runtime path uses asyncpg directly (no SQLAlchemy ORM); Alembic uses
      SQLAlchemy AsyncEngine + asyncpg via app/migrations/env.py.

  # -------------------------------------------------------------------------
  # SENTRY_DSN — error tracking destination (per A7 + D3).
  # -------------------------------------------------------------------------
  - name: SENTRY_DSN
    description: |
      Sentry DSN for THIS service's project at sentry.rishi.yral.com
      (NOT apm.yral.com per A7). The sentry_middleware.py auto-tags
      every event with service=yral-rishi-agent-user-memory-service per D3.
    required_in: [local, ci, production]
    source:
      local: ".env.local (use a dev Sentry project so local errors don't pollute prod)"
      ci: "GitHub Secret SENTRY_DSN"
      production: "GitHub Secret SENTRY_DSN → Swarm secret at deploy"
    rotation_policy: "stable; rotates only if Sentry org migrates"
    consumed_by:
      - app/sentry_middleware.py
    classification:
      blast_radius: low
      access_pattern: write-only
    notes: |
      Sentry DSNs are write-only by design — a leaked DSN lets an attacker
      submit fake events, not read existing ones.

  # -------------------------------------------------------------------------
  # LANGFUSE_PUBLIC_KEY — LLM trace ingestion key (per D4).
  # -------------------------------------------------------------------------
  - name: LANGFUSE_PUBLIC_KEY
    description: |
      Langfuse project public key. Phase 1 user-memory-service doesn't make
      LLM calls (the orchestrator does). Included per template standard so
      Phase 2 memory-extraction worker can add tracing without a separate
      secrets PR. Paired with LANGFUSE_SECRET_KEY.
    required_in: [local, ci, production]
    source:
      local: ".env.local (optional — LANGFUSE_TRACING_ENABLED=false locally)"
      ci: "GitHub Secret LANGFUSE_PUBLIC_KEY"
      production: "GitHub Secret LANGFUSE_PUBLIC_KEY → Swarm secret at deploy"
    rotation_policy: "every 180 days"
    consumed_by:
      - app/langfuse_middleware.py
    classification:
      blast_radius: low
      access_pattern: write-only

  # -------------------------------------------------------------------------
  # LANGFUSE_SECRET_KEY — LLM trace ingestion secret (per D4).
  # -------------------------------------------------------------------------
  - name: LANGFUSE_SECRET_KEY
    description: |
      Langfuse project secret key. Paired with LANGFUSE_PUBLIC_KEY.
      See LANGFUSE_PUBLIC_KEY notes above — same rationale for Phase 1
      inclusion despite no current LLM calls.
    required_in: [local, ci, production]
    source:
      local: ".env.local (optional — see LANGFUSE_PUBLIC_KEY)"
      ci: "GitHub Secret LANGFUSE_SECRET_KEY"
      production: "GitHub Secret LANGFUSE_SECRET_KEY → Swarm secret at deploy"
    rotation_policy: "every 180 days; rotate alongside LANGFUSE_PUBLIC_KEY"
    consumed_by:
      - app/langfuse_middleware.py
    classification:
      blast_radius: medium
      access_pattern: write-only


# ===========================================================================
# RELATED FILES:
#   .env.example                — auto-generated companion (run gen-env-example.sh)
#   project.config              — non-secret runtime values
#   docker-compose.swarm.yml    — declares the `secrets:` block for Swarm
#   scripts/validate-secrets.sh — CI gate
#   scripts/sync-github-secrets.sh — interactive GitHub Secret populator
# ===========================================================================
