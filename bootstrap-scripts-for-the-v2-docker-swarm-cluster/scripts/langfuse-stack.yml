# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  langfuse-stack.yml                                                         ║
# ║                                                                              ║
# ║  ⭐ THIS FILE IN ONE SENTENCE                                                ║
# ║  Docker Swarm stack that runs Langfuse 3 (web + worker) on rishi-6 with    ║
# ║  ClickHouse for high-cardinality trace storage and the shared Patroni     ║
# ║  cluster (langfuse schema) for primary metadata, per CONSTRAINTS D4.      ║
# ║                                                                              ║
# ║  📖 EXPLAINED FOR A NON-PROGRAMMER                                           ║
# ║  Langfuse 3.x split its storage: structured metadata (projects, users,    ║
# ║  API keys) live in Postgres; high-cardinality trace events (spans,        ║
# ║  generations, observations) live in ClickHouse. We point Langfuse's       ║
# ║  Postgres URL at our shared Patroni cluster (schema `langfuse`); we run   ║
# ║  ClickHouse alongside on rishi-6 as a co-located Swarm service.           ║
# ║                                                                              ║
# ║  🔗 HOW IT FITS                                                              ║
# ║  - Deployed by langfuse-install.sh (envsubst's the SHA-rotated secrets).  ║
# ║  - Networks: data-plane overlay (Postgres + ClickHouse) + internal-       ║
# ║    service-overlay (so v2 services post traces).                          ║
# ║  - Storage: /data/clickhouse-data on rishi-6 (bind mount, V2 §7.2).       ║
# ║                                                                              ║
# ║  ⚠️ DRAFT — NO STACKS DEPLOYED YET (per agent spec + A13).                   ║
# ║                                                                              ║
# ╚══════════════════════════════════════════════════════════════════════════╝

version: "3.9"

services:

  # ───────────────── ClickHouse (rishi-6, langfuse traces) ────────────────

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    hostname: langfuse-clickhouse
    networks:
      - yral-v2-data-plane
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/langfuse-clickhouse-password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    # Langfuse 3's ClickHouse migrations emit `CREATE TABLE ... ON CLUSTER
    # ${CLICKHOUSE_CLUSTER_NAME}` (defaults to "default") for distributed
    # coordination. Single-node ClickHouse has NO clusters defined out of
    # the box — the migration fails with `code: 139, message: There is no
    # Zookeeper configuration in server config` (Day-5-Step-3 deploy bug #9).
    #
    # The `command:` block below writes a 1-node ClickHouse config to
    # /etc/clickhouse-server/config.d/cluster.xml at container start,
    # then exec's the standard /entrypoint.sh. The config:
    #   - Enables embedded ClickHouse Keeper (server_id=1) on tcp 9181
    #   - Points the <zookeeper> client at localhost:9181 (self-keeper)
    #   - Defines a 1-shard 1-replica cluster named `default` over
    #     localhost:9000 so `ON CLUSTER default` resolves
    #   - Sets macros so {shard} {replica} templating works in migrations
    # Coordination state (raft log + snapshots) goes to /var/lib/clickhouse/
    # coordination/ which is on the host bind mount (/data/clickhouse-data
    # owned 101:101 per operator setup) so it survives container restarts.
    # List-form `command:` + `|` literal scalar avoids the YAML folded-
    # scalar trap fixed in Day-5-Step-2 PR (redis-primary command:).
    command:
      - sh
      - -c
      - |
        cat > /etc/clickhouse-server/config.d/cluster.xml <<'CFG'
        <clickhouse>
          <listen_host>0.0.0.0</listen_host>
          <keeper_server>
            <tcp_port>9181</tcp_port>
            <server_id>1</server_id>
            <log_storage_path>/var/lib/clickhouse/coordination/log</log_storage_path>
            <snapshot_storage_path>/var/lib/clickhouse/coordination/snapshots</snapshot_storage_path>
            <coordination_settings>
              <operation_timeout_ms>10000</operation_timeout_ms>
              <session_timeout_ms>30000</session_timeout_ms>
              <raft_logs_level>warning</raft_logs_level>
            </coordination_settings>
            <raft_configuration>
              <server>
                <id>1</id>
                <hostname>localhost</hostname>
                <port>9234</port>
              </server>
            </raft_configuration>
          </keeper_server>
          <zookeeper>
            <node>
              <host>localhost</host>
              <port>9181</port>
            </node>
          </zookeeper>
          <macros>
            <shard>shard1</shard>
            <replica>replica1</replica>
          </macros>
          <remote_servers>
            <default>
              <shard>
                <internal_replication>false</internal_replication>
                <replica>
                  <host>localhost</host>
                  <port>9000</port>
                </replica>
              </shard>
            </default>
          </remote_servers>
        </clickhouse>
        CFG
        exec /entrypoint.sh
    secrets:
      - source: ${YRAL_LANGFUSE_STACK_RESOLVED_YRAL_V2_LANGFUSE_CLICKHOUSE_PASSWORD}
        target: langfuse-clickhouse-password
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.hostname == rishi-6]
      resources:
        limits:   { cpus: "1.5", memory: 4G }
        reservations: { cpus: "0.25", memory: 1G }
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
    volumes:
      - type: bind
        source: /data/clickhouse-data
        target: /var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }


  # ───────────────── Langfuse web (rishi-6) ───────────────────────────────

  langfuse-web:
    image: langfuse/langfuse:3
    hostname: langfuse-web
    networks:
      - yral-v2-data-plane
      - yral-v2-internal
    environment:
      # Next.js standalone server (/app/web/server.js) binds to
      # `process.env.HOSTNAME || '0.0.0.0'`. Docker/Swarm auto-sets
      # HOSTNAME from the `hostname:` directive above ("langfuse-web"),
      # so Next.js binds only to the overlay-network IP and NOT to
      # 127.0.0.1. The stack's wget healthcheck probes localhost:3000
      # and gets `Connection refused` every interval; after 5 failed
      # probes Swarm kills the container with exit 137 / "unhealthy
      # container". Day-5-Step-3 attempt #12 surfaced this — health.Log
      # on dead container ed6adb0a0784 confirmed `wget: can't connect
      # to remote host: Connection refused` x5. Explicitly setting
      # HOSTNAME=0.0.0.0 here overrides the Docker-set env var so
      # Next.js binds to all interfaces (including loopback). Inter-
      # service DNS is unaffected — that resolves via Docker DNS based
      # on the `hostname:` directive, not the in-container env var.
      HOSTNAME: "0.0.0.0"
      # Langfuse 3 ONLY supports DATABASE_URL — not the discrete
      # DATABASE_HOST/PORT/NAME/USERNAME + DATABASE_PASSWORD_FILE form
      # that Langfuse 2 accepted. First Day-5-Step-3 deploy bit us
      # with the discrete form and an explicit error:
      #   "Required database environment variables are not set.
      #    Provide a postgres url for DATABASE_URL."
      # The password is rendered inline by envsubst (whitelisted in
      # langfuse-install.sh's render step). Postgres lives on the
      # shared Patroni cluster behind pgbouncer; schema `langfuse`.
      # Base64url password chars [a-zA-Z0-9_-] are all unreserved in
      # RFC 3986 userinfo so no URL-encoding is needed.
      DATABASE_URL: postgresql://langfuse:${YRAL_LANGFUSE_POSTGRES_PASSWORD_RENDERED}@pgbouncer:5432/postgres?schema=langfuse
      # DIRECT_URL bypasses pgbouncer and connects straight to the
      # Patroni leader on port 5432. Prisma migrations use it because:
      # pgbouncer is configured `POOL_MODE: transaction`, which
      # multiplexes upstream connections across client transactions.
      # Prisma migrations rely on `pg_advisory_lock()` — session-scoped
      # locks. When a migration container dies through transaction-
      # pooled pgbouncer, the upstream session that held the lock may
      # be returned to pgbouncer's pool with the lock still held;
      # subsequent migrations time out with
      # `Context: Timed out trying to acquire a postgres advisory
      # lock (SELECT pg_advisory_lock(72707369))`. Day-5-Step-3 deploy
      # attempts #6-#8 surfaced this repeatedly. Industry-standard fix
      # per Prisma docs (https://pris.ly/d/migrate-advisory-locking):
      # set DIRECT_URL to bypass the connection pooler for migrations
      # while DATABASE_URL stays pooled for fast runtime queries.
      DIRECT_URL: postgresql://langfuse:${YRAL_LANGFUSE_POSTGRES_PASSWORD_RENDERED}@patroni-rishi-4:5432/postgres?schema=langfuse
      NEXTAUTH_URL: https://langfuse.rishi.yral.com
      # Langfuse 3's Next.js app uses t3-env createEnv (web/src/env.mjs)
      # which validates `process.env.NEXTAUTH_SECRET` / `SALT` /
      # `ENCRYPTION_KEY` directly. The container's `/app/web/entrypoint.sh`
      # does NOT expand `*_FILE` env vars into their plain counterparts —
      # `_FILE` is honored ONLY by some runtime code paths (e.g. the
      # shared validator's CLICKHOUSE_PASSWORD path) but NOT by the
      # Next.js boot-time server schema. Day-5-Step-3 attempt #10 surfaced
      # this: `unhandledRejection: Error: An error occurred while loading
      # instrumentation hook: Invalid environment variables`. Diagnostic
      # extracted the t3-env schema from web/src/env.mjs (upstream main);
      # 7 vars are truly-required in NODE_ENV=production; the 4 NOT yet
      # set inline were SALT (z.string explicit-error), NEXTAUTH_SECRET
      # (z.string().min(1) in production), and ENCRYPTION_KEY (.optional()
      # but needed at runtime for API-key encryption — added for runtime
      # correctness, not just validator passage).
      #
      # The _FILE mounts stay declared for compatibility but the inline
      # forms are what actually take effect. Future cleanup: drop the
      # _FILE entries since they're unused.
      NEXTAUTH_SECRET_FILE: /run/secrets/langfuse-nextauth-secret
      NEXTAUTH_SECRET: ${YRAL_LANGFUSE_NEXTAUTH_SECRET_RENDERED}
      ENCRYPTION_KEY_FILE: /run/secrets/langfuse-encryption-key
      ENCRYPTION_KEY: ${YRAL_LANGFUSE_ENCRYPTION_KEY_RENDERED}
      SALT: ${YRAL_LANGFUSE_SALT_RENDERED}
      # ClickHouse for traces.
      # CLICKHOUSE_URL is used at runtime (HTTP, port 8123).
      # CLICKHOUSE_MIGRATION_URL is used by Langfuse 3's `langfuse-cli`
      # at container start to apply ClickHouse migrations. It MUST be
      # a `clickhouse://` URL on the native protocol port (9000) with
      # credentials embedded — Langfuse 3 has no `*_FILE` variant for
      # this URL and the discrete fields (`CLICKHOUSE_USER` +
      # `CLICKHOUSE_PASSWORD_FILE`) only cover the runtime HTTP
      # client. Day-5-Step-3 deploy attempt #6 errored:
      #   "Error: CLICKHOUSE_MIGRATION_URL is not configured.
      #    Please set CLICKHOUSE_MIGRATION_URL in your env variables.
      #    Applying clickhouse migrations failed."
      # Same render-via-envsubst pattern as DATABASE_URL (PR #61).
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse:${YRAL_LANGFUSE_CLICKHOUSE_PASSWORD_RENDERED}@langfuse-clickhouse:9000
      CLICKHOUSE_USER: langfuse
      # Langfuse 3's migration CLI errored with `Error: CLICKHOUSE_PASSWORD
      # is not set` on Day-5-Step-3 attempt #7 even with CLICKHOUSE_PASSWORD_
      # FILE pointing at the mounted secret — same Langfuse-3-no-_FILE-
      # variant pattern as DATABASE_URL. Switch to inline CLICKHOUSE_
      # PASSWORD rendered via envsubst (reuses the existing whitelist
      # placeholder). The CLICKHOUSE_PASSWORD_FILE mount is no longer
      # needed for web/worker since the env-var is now direct.
      CLICKHOUSE_PASSWORD: ${YRAL_LANGFUSE_CLICKHOUSE_PASSWORD_RENDERED}
      CLICKHOUSE_DB: langfuse
      # Redis (shared cluster Sentinel) for background queues.
      REDIS_HOST: redis-sentinel-rishi-4
      REDIS_PORT: "26379"
      LANGFUSE_DEFAULT_PROJECT_ID: yral-v2-default
      TELEMETRY_ENABLED: "false"
      # Langfuse 3 REQUIRES this even when no real S3 backend is set
      # up yet — the shared zod env validator in @langfuse/shared/dist/
      # src/env.js:166 declares it as a non-optional string. Without
      # this, the WORKER container crashes at startup with
      # `Invalid input: expected string, received undefined` (web hits
      # migration errors before the validator runs, so the gap only
      # surfaced on worker — Day-5-Step-3 deploy attempt #8). We use a
      # placeholder bucket name; real S3 (MinIO sidecar or Hetzner
      # Object Storage) is deferred. Optional siblings
      # (REGION/ENDPOINT/ACCESS_KEY_ID/SECRET_ACCESS_KEY) stay unset
      # — Langfuse will fail any actual event-upload attempt, but the
      # container starts. Sufficient for Day-5 Step 3 to close + lets
      # services come up so we can verify auth/migrations/queues.
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: yral-v2-langfuse-events-placeholder-no-real-s3-yet
    secrets:
      - source: ${YRAL_LANGFUSE_STACK_RESOLVED_YRAL_V2_LANGFUSE_NEXTAUTH_SECRET}
        target: langfuse-nextauth-secret
      - source: ${YRAL_LANGFUSE_STACK_RESOLVED_YRAL_V2_LANGFUSE_ENCRYPTION_KEY}
        target: langfuse-encryption-key
      - source: ${YRAL_LANGFUSE_STACK_RESOLVED_YRAL_V2_LANGFUSE_POSTGRES_PASSWORD}
        target: langfuse-postgres-password
      - source: ${YRAL_LANGFUSE_STACK_RESOLVED_YRAL_V2_LANGFUSE_CLICKHOUSE_PASSWORD}
        target: langfuse-clickhouse-password
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.hostname == rishi-6]
      resources:
        limits:   { cpus: "1.0", memory: 1.5G }
        reservations: { cpus: "0.25", memory: 512M }
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/public/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s


  # ───────────────── Langfuse worker (rishi-6) ────────────────────────────

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    hostname: langfuse-worker
    networks:
      - yral-v2-data-plane
    environment:
      # See langfuse-web's DATABASE_URL comment block above for full rationale.
      DATABASE_URL: postgresql://langfuse:${YRAL_LANGFUSE_POSTGRES_PASSWORD_RENDERED}@pgbouncer:5432/postgres?schema=langfuse
      ENCRYPTION_KEY_FILE: /run/secrets/langfuse-encryption-key
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: langfuse
      # See langfuse-web's CLICKHOUSE_PASSWORD comment block above.
      CLICKHOUSE_PASSWORD: ${YRAL_LANGFUSE_CLICKHOUSE_PASSWORD_RENDERED}
      CLICKHOUSE_DB: langfuse
      REDIS_HOST: redis-sentinel-rishi-4
      REDIS_PORT: "26379"
      # The worker's zod env validator is the SAME shared schema as
      # web's (@langfuse/shared/dist/src/env.js). It enforces this
      # as a required string. Without it, worker crashes at startup
      # with `Invalid input: expected string, received undefined`.
      # See langfuse-web for the placeholder rationale.
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: yral-v2-langfuse-events-placeholder-no-real-s3-yet
    secrets:
      - source: ${YRAL_LANGFUSE_STACK_RESOLVED_YRAL_V2_LANGFUSE_ENCRYPTION_KEY}
        target: langfuse-encryption-key
      - source: ${YRAL_LANGFUSE_STACK_RESOLVED_YRAL_V2_LANGFUSE_POSTGRES_PASSWORD}
        target: langfuse-postgres-password
      - source: ${YRAL_LANGFUSE_STACK_RESOLVED_YRAL_V2_LANGFUSE_CLICKHOUSE_PASSWORD}
        target: langfuse-clickhouse-password
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.hostname == rishi-6]
      resources:
        limits:   { cpus: "1.0", memory: 1G }
        reservations: { cpus: "0.25", memory: 384M }
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5


secrets:
  ${YRAL_LANGFUSE_STACK_RESOLVED_YRAL_V2_LANGFUSE_NEXTAUTH_SECRET}:
    external: true
  ${YRAL_LANGFUSE_STACK_RESOLVED_YRAL_V2_LANGFUSE_ENCRYPTION_KEY}:
    external: true
  ${YRAL_LANGFUSE_STACK_RESOLVED_YRAL_V2_LANGFUSE_POSTGRES_PASSWORD}:
    external: true
  ${YRAL_LANGFUSE_STACK_RESOLVED_YRAL_V2_LANGFUSE_CLICKHOUSE_PASSWORD}:
    external: true


networks:
  yral-v2-data-plane:
    external: true
  yral-v2-internal:
    external: true


# ══════════════════════════════════════════════════════════════════════════
# RELATED FILES
# ─────────────
# - langfuse-install.sh      — deploys this stack with SHA-rotated secrets.
# - patroni-stack.yml        — provides the Postgres backend for Langfuse.
# - redis-sentinel-stack.yml — provides Redis queue backend.
# - ../secrets-manifest.yaml — declares the four Langfuse secrets.
