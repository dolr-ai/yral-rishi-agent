# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  patroni-stack.yml                                                          ║
# ║                                                                              ║
# ║  ⭐ THIS FILE IN ONE SENTENCE                                                ║
# ║  Docker Swarm stack file that wires up the v2 cluster's HA Postgres:       ║
# ║  3-node etcd quorum + 3-node Patroni cluster (one per host) + 2-replica   ║
# ║  pgBouncer in front, all on the encrypted data-plane overlay only.        ║
# ║                                                                              ║
# ║  📖 EXPLAINED FOR A NON-PROGRAMMER                                           ║
# ║  Each `services:` entry below is one Docker Swarm service. They are       ║
# ║  pinned to specific hostnames via `placement.constraints` so etcd-1       ║
# ║  always lives on rishi-4, etcd-2 on rishi-5, etcd-3 on rishi-6. Same      ║
# ║  pinning for Patroni: leader candidate on rishi-4, sync replica on        ║
# ║  rishi-5, async replica on rishi-6. Patroni picks who is actually leader  ║
# ║  via etcd consensus — the pinning just controls placement, not roles.    ║
# ║                                                                              ║
# ║  🔗 HOW IT FITS                                                              ║
# ║  - Deployed by patroni-install.sh; it renders ${YRAL_PATRONI_STACK_       ║
# ║    RESOLVED_*} placeholders below with SHA-rotating Swarm secret names    ║
# ║    per CONSTRAINTS H2.                                                     ║
# ║  - Networks:    only yral-v2-data-plane — no public exposure   ║
# ║                 per CONSTRAINTS C3.                                        ║
# ║  - Storage:     /data/patroni-data per node, bind-mounted (V2 infra §7.2).║
# ║                                                                              ║
# ║  ⚠️ DRAFT — NO STACKS DEPLOYED YET (per agent spec + A13).                   ║
# ║                                                                              ║
# ╚══════════════════════════════════════════════════════════════════════════╝

version: "3.9"

# Anchor block: every container shares these defaults so we don't restate
# resource limits, restart policy, and overlay attachment per service.
x-yral-data-plane-defaults: &yral_data_plane_defaults
  networks:
    - yral-v2-data-plane
  deploy:
    restart_policy:
      condition: any
      delay: 5s
      max_attempts: 5
      window: 60s


services:

  # ───────────────── etcd quorum (3 nodes, one per host) ──────────────────

  etcd-rishi-4:
    <<: *yral_data_plane_defaults
    image: quay.io/coreos/etcd:v3.5.13
    hostname: etcd-rishi-4
    command:
      - etcd
      - --name=etcd-rishi-4
      - --data-dir=/var/lib/etcd
      - --advertise-client-urls=http://etcd-rishi-4:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd-rishi-4:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd-rishi-4=http://etcd-rishi-4:2380,etcd-rishi-5=http://etcd-rishi-5:2380,etcd-rishi-6=http://etcd-rishi-6:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=yral-v2-etcd-cluster
      # etcd 3.4+ disables the v2 REST API by default, but the bundled Patroni
      # in ghcr.io/zalando/spilo-15:3.0-p1 still hits `/v2/machines` for
      # discovery — the v2 API is the Spilo 3.0 default and the ETCD3 config
      # path is a separate code path. First Day-5 deploy looped on
      # "Failed to get list of machines from http://etcd-rishi-N:2379/v2:
      # Bad response: 404 page not found". `--enable-v2=true` brings the v2
      # API back; etcd 3.5.13 still supports it (was removed only in 3.6).
      - --enable-v2=true
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.hostname == rishi-4]
      resources:
        limits:   { cpus: "0.5", memory: 512M }
        reservations: { cpus: "0.1", memory: 128M }
    volumes:
      - type: bind
        source: /data/etcd-rishi-4
        target: /var/lib/etcd

  etcd-rishi-5:
    <<: *yral_data_plane_defaults
    image: quay.io/coreos/etcd:v3.5.13
    hostname: etcd-rishi-5
    command:
      - etcd
      - --name=etcd-rishi-5
      - --data-dir=/var/lib/etcd
      - --advertise-client-urls=http://etcd-rishi-5:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd-rishi-5:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd-rishi-4=http://etcd-rishi-4:2380,etcd-rishi-5=http://etcd-rishi-5:2380,etcd-rishi-6=http://etcd-rishi-6:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=yral-v2-etcd-cluster
      - --enable-v2=true  # see etcd-rishi-4 comment block above for full context
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.hostname == rishi-5]
      resources:
        limits:   { cpus: "0.5", memory: 512M }
        reservations: { cpus: "0.1", memory: 128M }
    volumes:
      - type: bind
        source: /data/etcd-rishi-5
        target: /var/lib/etcd

  etcd-rishi-6:
    <<: *yral_data_plane_defaults
    image: quay.io/coreos/etcd:v3.5.13
    hostname: etcd-rishi-6
    command:
      - etcd
      - --name=etcd-rishi-6
      - --data-dir=/var/lib/etcd
      - --advertise-client-urls=http://etcd-rishi-6:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd-rishi-6:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd-rishi-4=http://etcd-rishi-4:2380,etcd-rishi-5=http://etcd-rishi-5:2380,etcd-rishi-6=http://etcd-rishi-6:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=yral-v2-etcd-cluster
      - --enable-v2=true  # see etcd-rishi-4 comment block above for full context
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.hostname == rishi-6]
      resources:
        limits:   { cpus: "0.5", memory: 512M }
        reservations: { cpus: "0.1", memory: 128M }
    volumes:
      - type: bind
        source: /data/etcd-rishi-6
        target: /var/lib/etcd


  # ────────── Patroni / Postgres 15 — Spilo image (Zalando) ───────────────
  # Spilo bundles Patroni + Postgres + WAL-G + pgBackRest; configuration is
  # primarily environment-variable-driven. Each instance has a stable hostname so etcd
  # discovery and Patroni leader election work deterministically.

  patroni-rishi-4:
    <<: *yral_data_plane_defaults
    image: ghcr.io/zalando/spilo-15:3.0-p1
    hostname: patroni-rishi-4
    environment:
      SCOPE: yral-v2-postgres
      PGVERSION: "15"
      # Use Spilo's ETCD3_HOSTS (native v3 gRPC) instead of the legacy
      # ETCD_HOSTS (v2 REST). PR #47 had to enable etcd's v2 REST API
      # endpoint (`--enable-v2=true` on the etcd command line, see the
      # etcd-rishi-4 service block above) because Spilo's default code
      # path hits /v2/machines for discovery and etcd 3.4+ disables that
      # endpoint by default. etcd 3.6 will REMOVE the v2 endpoint
      # entirely — so we forward-proof by moving Patroni to the v3
      # native code path now. The --enable-v2=true flag on etcd stays
      # for safety on 3.5; that flag can be retired in a separate
      # cleanup PR once this migration is verified in the live cluster.
      ETCD3_HOSTS: etcd-rishi-4:2379,etcd-rishi-5:2379,etcd-rishi-6:2379
      PATRONI_NAME: patroni-rishi-4
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni-rishi-4:8008
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni-rishi-4:5432
      PATRONI_POSTGRESQL_DATA_DIR: /home/postgres/pgdata/pgroot/data
      PATRONI_POSTGRESQL_BIN_DIR: /usr/lib/postgresql/15/bin
      # Sync commit on at least one replica per CONSTRAINTS F3.
      PATRONI_SYNCHRONOUS_MODE: "true"
      PATRONI_SYNCHRONOUS_MODE_STRICT: "false"
      PATRONI_MAXIMUM_LAG_ON_FAILOVER: "1048576"
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_REPLICATION_USERNAME: standby
      PATRONI_admin_USERNAME: admin
      # WAL-G archive command for L2 backups per CONSTRAINTS D2.
      WALG_S3_PREFIX: "${YRAL_PATRONI_WALG_S3_PREFIX_RENDERED}"
      AWS_S3_FORCE_PATH_STYLE: "${YRAL_PATRONI_S3_FORCE_PATH_STYLE_RENDERED}"
      AWS_REGION: "${YRAL_HETZNER_S3_REGION}"
      AWS_ENDPOINT: "${YRAL_HETZNER_S3_ENDPOINT}"
      USE_WALG_BACKUP: "${YRAL_PATRONI_USE_WALG}"
      USE_WALG_RESTORE: "${YRAL_PATRONI_USE_WALG}"
      USE_WALE_S3_BACKUP: "${YRAL_PATRONI_USE_WALE_S3_BACKUP_RENDERED}"
      USE_WALE_GS_BACKUP: "${YRAL_PATRONI_USE_WALE_GS_BACKUP_RENDERED}"
    secrets:
      - source: ${YRAL_PATRONI_STACK_RESOLVED_YRAL_V2_POSTGRES_SUPERUSER_PASSWORD}
        target: postgres-superuser-password
      - source: ${YRAL_PATRONI_STACK_RESOLVED_YRAL_V2_PATRONI_REPLICATION_PASSWORD}
        target: patroni-replication-password
      - source: ${YRAL_PATRONI_STACK_RESOLVED_YRAL_V2_PATRONI_REST_API_PASSWORD}
        target: patroni-rest-api-password
      - source: ${YRAL_PATRONI_STACK_RESOLVED_YRAL_V2_HETZNER_S3_ACCESS_KEY_ID}
        target: hetzner-s3-access-key-id
      - source: ${YRAL_PATRONI_STACK_RESOLVED_YRAL_V2_HETZNER_S3_SECRET_ACCESS_KEY}
        target: hetzner-s3-secret-access-key
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.hostname == rishi-4]
      resources:
        limits:   { cpus: "1.5", memory: 3G }
        reservations: { cpus: "0.5", memory: 1G }
    volumes:
      - type: bind
        source: /data/patroni-data
        target: /home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8008/liveness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  patroni-rishi-5:
    <<: *yral_data_plane_defaults
    image: ghcr.io/zalando/spilo-15:3.0-p1
    hostname: patroni-rishi-5
    environment:
      SCOPE: yral-v2-postgres
      PGVERSION: "15"
      ETCD3_HOSTS: etcd-rishi-4:2379,etcd-rishi-5:2379,etcd-rishi-6:2379  # see patroni-rishi-4 comment block above for full ETCD3 migration rationale
      PATRONI_NAME: patroni-rishi-5
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni-rishi-5:8008
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni-rishi-5:5432
      PATRONI_POSTGRESQL_DATA_DIR: /home/postgres/pgdata/pgroot/data
      PATRONI_POSTGRESQL_BIN_DIR: /usr/lib/postgresql/15/bin
      PATRONI_SYNCHRONOUS_MODE: "true"
      PATRONI_SYNCHRONOUS_MODE_STRICT: "false"
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_REPLICATION_USERNAME: standby
      PATRONI_admin_USERNAME: admin
      WALG_S3_PREFIX: "${YRAL_PATRONI_WALG_S3_PREFIX_RENDERED}"
      AWS_S3_FORCE_PATH_STYLE: "${YRAL_PATRONI_S3_FORCE_PATH_STYLE_RENDERED}"
      AWS_REGION: "${YRAL_HETZNER_S3_REGION}"
      AWS_ENDPOINT: "${YRAL_HETZNER_S3_ENDPOINT}"
      USE_WALG_BACKUP: "${YRAL_PATRONI_USE_WALG}"
      USE_WALG_RESTORE: "${YRAL_PATRONI_USE_WALG}"
      USE_WALE_S3_BACKUP: "${YRAL_PATRONI_USE_WALE_S3_BACKUP_RENDERED}"
      USE_WALE_GS_BACKUP: "${YRAL_PATRONI_USE_WALE_GS_BACKUP_RENDERED}"
    secrets:
      - source: ${YRAL_PATRONI_STACK_RESOLVED_YRAL_V2_POSTGRES_SUPERUSER_PASSWORD}
        target: postgres-superuser-password
      - source: ${YRAL_PATRONI_STACK_RESOLVED_YRAL_V2_PATRONI_REPLICATION_PASSWORD}
        target: patroni-replication-password
      - source: ${YRAL_PATRONI_STACK_RESOLVED_YRAL_V2_PATRONI_REST_API_PASSWORD}
        target: patroni-rest-api-password
      - source: ${YRAL_PATRONI_STACK_RESOLVED_YRAL_V2_HETZNER_S3_ACCESS_KEY_ID}
        target: hetzner-s3-access-key-id
      - source: ${YRAL_PATRONI_STACK_RESOLVED_YRAL_V2_HETZNER_S3_SECRET_ACCESS_KEY}
        target: hetzner-s3-secret-access-key
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.hostname == rishi-5]
      resources:
        limits:   { cpus: "1.5", memory: 3G }
        reservations: { cpus: "0.5", memory: 1G }
    volumes:
      - type: bind
        source: /data/patroni-data
        target: /home/postgres/pgdata

  patroni-rishi-6:
    <<: *yral_data_plane_defaults
    image: ghcr.io/zalando/spilo-15:3.0-p1
    hostname: patroni-rishi-6
    environment:
      SCOPE: yral-v2-postgres
      PGVERSION: "15"
      ETCD3_HOSTS: etcd-rishi-4:2379,etcd-rishi-5:2379,etcd-rishi-6:2379  # see patroni-rishi-4 comment block above for full ETCD3 migration rationale
      PATRONI_NAME: patroni-rishi-6
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni-rishi-6:8008
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni-rishi-6:5432
      PATRONI_POSTGRESQL_DATA_DIR: /home/postgres/pgdata/pgroot/data
      PATRONI_POSTGRESQL_BIN_DIR: /usr/lib/postgresql/15/bin
      # Per V2 infra doc §5: rishi-6 stays async-only if it ends up cross-DC,
      # so it never becomes the synchronous replica. Patroni respects this
      # via tags below.
      PATRONI_TAGS_NOSYNC: "true"
      PATRONI_TAGS_NOLOADBALANCE: "false"
      PATRONI_TAGS_CLONEFROM: "false"
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_REPLICATION_USERNAME: standby
      PATRONI_admin_USERNAME: admin
      WALG_S3_PREFIX: "${YRAL_PATRONI_WALG_S3_PREFIX_RENDERED}"
      AWS_S3_FORCE_PATH_STYLE: "${YRAL_PATRONI_S3_FORCE_PATH_STYLE_RENDERED}"
      AWS_REGION: "${YRAL_HETZNER_S3_REGION}"
      AWS_ENDPOINT: "${YRAL_HETZNER_S3_ENDPOINT}"
      USE_WALG_BACKUP: "${YRAL_PATRONI_USE_WALG}"
      USE_WALG_RESTORE: "${YRAL_PATRONI_USE_WALG}"
      USE_WALE_S3_BACKUP: "${YRAL_PATRONI_USE_WALE_S3_BACKUP_RENDERED}"
      USE_WALE_GS_BACKUP: "${YRAL_PATRONI_USE_WALE_GS_BACKUP_RENDERED}"
    secrets:
      - source: ${YRAL_PATRONI_STACK_RESOLVED_YRAL_V2_POSTGRES_SUPERUSER_PASSWORD}
        target: postgres-superuser-password
      - source: ${YRAL_PATRONI_STACK_RESOLVED_YRAL_V2_PATRONI_REPLICATION_PASSWORD}
        target: patroni-replication-password
      - source: ${YRAL_PATRONI_STACK_RESOLVED_YRAL_V2_PATRONI_REST_API_PASSWORD}
        target: patroni-rest-api-password
      - source: ${YRAL_PATRONI_STACK_RESOLVED_YRAL_V2_HETZNER_S3_ACCESS_KEY_ID}
        target: hetzner-s3-access-key-id
      - source: ${YRAL_PATRONI_STACK_RESOLVED_YRAL_V2_HETZNER_S3_SECRET_ACCESS_KEY}
        target: hetzner-s3-secret-access-key
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.hostname == rishi-6]
      resources:
        limits:   { cpus: "1.5", memory: 3G }
        reservations: { cpus: "0.5", memory: 1G }
    volumes:
      - type: bind
        source: /data/patroni-data
        target: /home/postgres/pgdata


  # ─────── pgBouncer (2 replicas on edge nodes) ─────────────────────────
  # Per CONSTRAINTS G3: pgBouncer in front of Patroni from day 1. Each
  # service connects to pgbouncer:5432 and gets routed to the current
  # Patroni leader via pgBouncer's `auth_type=md5` + `dbname=*` config.

  pgbouncer:
    <<: *yral_data_plane_defaults
    # edoburu/pgbouncer publishes tags as `<upstream-version>-p<image-patch>`
    # (e.g. 1.21.0-p2, 1.22.0-p0). Bare `1.21.0` is NOT a published tag — the
    # first Day-5 deploy got `Rejected ... No such image: edoburu/pgbouncer:1.21.0`.
    # `1.21.0-p2` is the latest image patch of upstream 1.21.0.
    image: edoburu/pgbouncer:1.21.0-p2
    hostname: pgbouncer
    environment:
      DB_HOST: patroni-rishi-4
      DB_PORT: "5432"
      LISTEN_PORT: "5432"
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "20"
      RESERVE_POOL_SIZE: "5"
      RESERVE_POOL_TIMEOUT: "3"
      POOL_MODE: transaction
      # Patroni/Spilo on PG 15 stores role passwords in pg_authid using
      # SCRAM-SHA-256 (the PG 14+ default; superseded the older md5
      # method). pgbouncer's AUTH_TYPE must match the upstream's stored
      # hash type for both directions:
      #   - server-side: pgbouncer authenticates to upstream Patroni
      #     as DB_USER; PG demands SCRAM, md5 yields "cannot do SCRAM
      #     authentication: wrong password type".
      #   - client-side: pgbouncer challenges clients; SCRAM negotiates
      #     against the plain password edoburu wrote into userlist.txt
      #     when AUTH_TYPE=scram-sha-256 (vs. md5 which uses an md5
      #     hash format).
      # Day-5-Step-3 deploy attempt #4 surfaced this: pgbouncer logs
      # showed `cannot do SCRAM authentication: wrong password type`
      # against patroni-rishi-4 even though DB_PASSWORD was correct
      # (sha256 of the password matched the Swarm secret content).
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: postgres,admin
      # Connect to upstream Patroni as `postgres` superuser. edoburu's
      # entrypoint reads DB_USER + DB_PASSWORD (NOT _FILE — verified
      # against the image's entrypoint.sh source on rishi-4) and
      # populates `userlist.txt` with `"postgres" "md5<HASH>"` so
      # pgbouncer can auth itself to upstream Patroni and run the
      # AUTH_QUERY below for arbitrary client users.
      # Day-5-Step-3 deploy attempt #3 used DB_PASSWORD_FILE thinking
      # edoburu supported the Docker-secrets `_FILE` convention — it
      # doesn't. pgbouncer rolled with an EMPTY userlist.txt + couldn't
      # auth to upstream → all client connections (incl. Langfuse)
      # hung with `query_wait_timeout`.
      # The password lands in the rendered stack file under /tmp on
      # rishi-4 (root mode 0600, removed by patroni-install.sh post-
      # deploy) and in container env (visible to host root via /proc).
      # Same exposure level as the Langfuse DATABASE_URL fix (PR #61).
      # The postgres-superuser-password Swarm secret stays mounted at
      # /run/secrets/postgres-superuser-password for other consumers
      # — pgbouncer just doesn't read it directly.
      DB_USER: postgres
      DB_PASSWORD: ${YRAL_PATRONI_POSTGRES_SUPERUSER_PASSWORD_RENDERED}
      # Dynamic user lookup so clients other than `postgres` (e.g. the
      # `langfuse` role on the shared Patroni cluster) can authenticate
      # through pgbouncer without us pre-staging their password hashes
      # in a userlist file. pgbouncer connects to upstream Patroni as
      # AUTH_USER (= postgres = superuser), runs AUTH_QUERY against
      # pg_shadow on demand, validates the client's md5 challenge
      # against the returned hash. Day-5-Step-3 deploy attempt #2 bit
      # us with an empty userlist + no AUTH_QUERY → Langfuse's
      # connection to pgbouncer failed with "FATAL: password
      # authentication failed" even though the `langfuse` role had
      # been bootstrapped on Patroni itself.
      AUTH_USER: postgres
      AUTH_QUERY: SELECT usename, passwd FROM pg_shadow WHERE usename=$$1
    secrets:
      - source: ${YRAL_PATRONI_STACK_RESOLVED_YRAL_V2_POSTGRES_SUPERUSER_PASSWORD}
        target: postgres-superuser-password
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints: [node.labels.node_role == edge]
        preferences:
          - spread: node.hostname
      resources:
        limits:   { cpus: "0.5", memory: 384M }
        reservations: { cpus: "0.1", memory: 128M }


# Swarm secrets are created (with SHA-rotating names per H2) by
# patroni-install.sh BEFORE this stack is deployed. They appear here as
# `external: true` so deploy doesn't try to re-create them.
secrets:
  ${YRAL_PATRONI_STACK_RESOLVED_YRAL_V2_POSTGRES_SUPERUSER_PASSWORD}:
    external: true
  ${YRAL_PATRONI_STACK_RESOLVED_YRAL_V2_PATRONI_REPLICATION_PASSWORD}:
    external: true
  ${YRAL_PATRONI_STACK_RESOLVED_YRAL_V2_PATRONI_REST_API_PASSWORD}:
    external: true
  ${YRAL_PATRONI_STACK_RESOLVED_YRAL_V2_HETZNER_S3_ACCESS_KEY_ID}:
    external: true
  ${YRAL_PATRONI_STACK_RESOLVED_YRAL_V2_HETZNER_S3_SECRET_ACCESS_KEY}:
    external: true


# The data-plane overlay is created once by node-bootstrap.sh swarm-init.
networks:
  yral-v2-data-plane:
    external: true


# ══════════════════════════════════════════════════════════════════════════
# RELATED FILES
# ─────────────
# - patroni-install.sh   — deploys this stack; creates the SHA-suffixed secrets.
# - node-bootstrap.sh    — must run first (creates data-plane overlay + bind mounts).
# - ../secrets-manifest.yaml — declares every secret consumed here.
# ══════════════════════════════════════════════════════════════════════════
