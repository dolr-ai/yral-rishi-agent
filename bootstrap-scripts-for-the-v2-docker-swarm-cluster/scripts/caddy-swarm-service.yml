# Compose schema 3.9 is the highest version Swarm consumes; using it
# unlocks `mode: replicated`, `placement.constraints`, and config rotation.
version: "3.9"

services:

  # The single Caddy service. 2 replicas means traffic survives one node
  # going away — meets the chaos-test requirement in CONSTRAINTS H3.
  caddy-edge-ingress:
    # Pin to a known Caddy release. Bumping the tag is a deliberate PR;
    # `latest` would silently roll us forward and is forbidden everywhere
    # in v2.
    image: caddy:2.8.4-alpine

    # Deploy stanza is Swarm-only. Compose ignores it on a single laptop.
    deploy:
      mode: replicated
      replicas: 2
      placement:
        # Only edge-labelled nodes run this service. node-bootstrap.sh
        # tags rishi-4 and rishi-5 with node_role=edge; rishi-6 has
        # node_role=compute and therefore never schedules a replica here.
        constraints:
          - node.labels.node_role == edge
        # Spread the two replicas, one per node. Without this, the Swarm
        # scheduler might place both replicas on the same edge node and
        # we lose redundancy.
        preferences:
          - spread: node.hostname

      # Update strategy: roll one at a time with a 10s health-check pause
      # between replicas. Drains the old replica via stop-grace-period.
      update_config:
        parallelism: 1
        order: start-first
        delay: 10s
        failure_action: rollback

      rollback_config:
        parallelism: 1
        order: stop-first

      restart_policy:
        condition: on-failure
        max_attempts: 3
        window: 60s

      # Per CONSTRAINTS C3: the only host port v2 exposes is :443 on
      # rishi-4 and rishi-5. Swarm ingress mode load-balances incoming
      # TCP across the 2 replicas regardless of which edge node the
      # traffic actually lands on.
    ports:
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress

    # NOTE: original design specified `read_only: true` + `tmpfs: /tmp:size=64M`
    # for hardened-rootfs + writable /tmp. Day-5 Step 4 deploy bug #2 surfaced
    # that Docker Swarm v24+ does NOT honor the `tmpfs:` directive when
    # `read_only: true` is also set — /tmp ends up read-only inside the
    # container, and Caddy's `tls internal` machinery uses /tmp for atomic
    # cert write/install (truststore install + cert-issuance temp files).
    # With /tmp read-only, cert operations fail and every TLS handshake to
    # :443 aborts with `internal_error` (SSL alert 80). Dropping `read_only:
    # true` lets the container fs be writable, which restores /tmp. Slight
    # security loss (no hardened rootfs) is acceptable for this Caddy stack
    # because the only files Caddy creates outside its volumes are
    # short-lived cert temp files — the attack-surface delta is minimal.
    # If we ever want hardened rootfs back, the right shape is a named
    # volume mounted at /tmp (Swarm honors that consistently) instead of
    # the inline `tmpfs:` directive.
    tmpfs:
      - /tmp:size=64M

    volumes:
      # /data is Caddy's cert + state directory. Per-node bind mount via
      # a Swarm volume keeps each replica's cache local; failover regenerates.
      - type: volume
        source: yral_v2_edge_caddy_data
        target: /data
      - type: volume
        source: yral_v2_edge_caddy_config
        target: /config

    # The Caddyfile is delivered as a Swarm config object with a SHA-suffixed
    # name per CONSTRAINTS H2. `caddy-install.sh` hashes `caddyfile.placeholder`
    # (or whatever the active Caddyfile content file is) and creates a Swarm
    # config named `yral_v2_edge_caddyfile_<sha8>`, then exports the resolved
    # name as YRAL_EDGE_CADDY_STACK_RESOLVED_YRAL_V2_EDGE_CADDYFILE for envsubst
    # to render into this file. Editing the Caddyfile → new sha8 → new config
    # name → Swarm rolls the service onto the new config on next deploy.
    configs:
      - source: ${YRAL_EDGE_CADDY_STACK_RESOLVED_YRAL_V2_EDGE_CADDYFILE}
        target: /etc/caddy/Caddyfile
        mode: 0444

    networks:
      # Public web overlay only — Caddy must NOT see the internal or
      # data-plane overlays per CONSTRAINTS C3 isolation.
      - yral-v2-public-web

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s


# Named volumes — Swarm creates them on first deploy and persists across
# replica restarts. Local driver = the data lives on whichever node the
# replica runs on; that is fine because Caddy regenerates `tls internal`
# certs in seconds when a replica moves.
volumes:
  yral_v2_edge_caddy_data:
    driver: local
  yral_v2_edge_caddy_config:
    driver: local


# The overlay network is created once by node-bootstrap.sh; here we just
# reference it as `external: true` so the stack deploy does not try to
# (re)create it.
networks:
  yral-v2-public-web:
    external: true


# Caddyfile content arrives as an external Swarm config created by
# `caddy-install.sh` BEFORE `docker stack deploy`. The name is
# envsubst-rendered from YRAL_EDGE_CADDY_STACK_RESOLVED_YRAL_V2_EDGE_CADDYFILE
# (SHA-suffixed per CONSTRAINTS H2).
configs:
  ${YRAL_EDGE_CADDY_STACK_RESOLVED_YRAL_V2_EDGE_CADDYFILE}:
    external: true


# ══════════════════════════════════════════════════════════════════════════
# RELATED FILES
# ─────────────
# - node-bootstrap.sh
#       Creates yral-v2-public-web this stack attaches to.
# - ../secrets-manifest.yaml
#       Declares CADDY-related secrets (e.g. ACME account email if we ever
#       move off `tls internal` to real Let's Encrypt on the v2 cluster).
# - generate-caddy-swarm-config.sh (future deliverable)
#       Renders the Caddyfile body + creates the SHA-rotating Swarm config.
# - The rishi-1/2 Caddy snippet PR (Day 7 deliverable, against
#       dolr-ai/yral-rishi-hetzner-infra-template per CONSTRAINTS A2)
#       reverse-proxies into this Swarm service over `https://rishi-4:443
#       https://rishi-5:443`.
