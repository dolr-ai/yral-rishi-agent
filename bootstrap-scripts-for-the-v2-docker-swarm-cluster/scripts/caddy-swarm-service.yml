# ║  preamble was kept verbatim from PR #10 — semantically it IS the          ║
# ║  internal-cluster Caddy that receives proxied traffic from the (future)   ║
# ║  rishi-1/2/3 edge layer. There is NO separate "internal service-to-       ║
# ║  service" Caddy; v2 services talk via Swarm DNS over yral-v2-internal    ║
# ║  directly without an intermediary proxy.                                  ║
