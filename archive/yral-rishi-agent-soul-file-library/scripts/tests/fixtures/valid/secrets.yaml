# Test fixture for the "all required values present" happy path.
# Used by test_validate_secrets.sh + test_gen_env_example.sh.
# `required_in: [local]` only — tests don't need gh auth to exercise the
# local-env-var validation path.

service: yral-rishi-agent-test-fixture

secrets:
  - name: SAMPLE_DATABASE_URL
    description: |
      Sample Postgres connection string for the test fixture.
    required_in: [local]
    source:
      local: ".env.local"
    rotation_policy: "test only — not rotated"
    consumed_by:
      - app/database.py
    classification:
      blast_radius: low
      access_pattern: read

  - name: SAMPLE_REDIS_PASSWORD
    description: |
      Sample Redis password for the test fixture.
    required_in: [local]
    source:
      local: ".env.local"
    rotation_policy: "test only — not rotated"
    consumed_by:
      - app/redis_client.py
    classification:
      blast_radius: low
      access_pattern: read
