name: Gate A2 Pull-Request Benchmark (E1 latency merge-blocker)

on:
  pull_request:
    branches: [main]
    # NOTE — UNCONDITIONAL trigger (no `paths:` filter at the workflow
    # level). Required-check safety: with `paths:` at the trigger level,
    # GitHub leaves the check pending on pull requests that do not match,
    # which blocks unrelated docs/test/lint pull requests as required-
    # check failures. Codex round-22 BLOCKER flagged that. Fix: trigger
    # on every pull request, then exit successfully early in the job for
    # non-hot-path changes (see "Detect hot-path file changes" step).
  workflow_dispatch:
    # Manual re-run capability for debugging; NOT the primary trigger.
    # Requires an explicit `ref` input (e.g. branch name or SHA) because
    # github.event.pull_request.head.sha is undefined for non-pull-request
    # runs (Codex round-24 CONCERN, correctly flagged). The benchmark
    # checkout step below uses inputs.ref when present, otherwise falls
    # back to the pull request head SHA. The hot-path-detect step also
    # uses inputs.base_ref when present for the diff base.
    inputs:
      ref:
        description: 'Branch name or SHA to benchmark (required for manual runs).'
        required: true
        type: string
      base_ref:
        description: 'Diff base for hot-path detection (default: main).'
        required: false
        type: string
        default: 'main'

permissions:
  contents: read

jobs:
  benchmark:
    name: Gate A2 — measure send-message p95 against chat-ai baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pull request branch or manual-dispatch ref
        uses: actions/checkout@v4
        with:
          # On pull_request: use the PR head SHA.
          # On workflow_dispatch: use the explicit inputs.ref required for
          # manual runs (Codex round-24 CONCERN fix).
          ref: ${{ github.event.pull_request.head.sha || inputs.ref }}
          fetch-depth: 0

      - name: Detect hot-path file changes
        id: detect_hot_path
        run: |
          # Detect whether this pull request touches any hot-path file.
          # Keep this list in sync with the Gate A2-PR section in
          # interface-contracts/01-internal-rpc-contracts.md.
          # On pull_request: diff base is origin/main (the PR's target branch).
          # On workflow_dispatch: diff base is inputs.base_ref (default 'main')
          # so the same hot-path-detection logic works for manual runs (Codex
          # round-24 CONCERN fix).
          COMPARISON_BASE_BRANCH="${{ inputs.base_ref || 'main' }}"
          git fetch origin "$COMPARISON_BASE_BRANCH"
          CHANGED_FILES=$(git diff --name-only "origin/$COMPARISON_BASE_BRANCH...HEAD")
          # NOTE — the regex also covers the gate's OWN files (the benchmark
          # script directory + this workflow file). PRs that modify the gate
          # itself MUST trigger the gate, otherwise the gate could be silently
          # weakened by a self-modifying PR. Codex round-23 BLOCKER correctly
          # flagged that round-22's regex left the gate self-unprotected.
          HOT_PATH_PATTERN='^(yral-rishi-agent-public-api/|yral-rishi-agent-user-memory-service/|yral-rishi-agent-conversation-turn-orchestrator/app/|shared-library-code-used-by-every-v2-service/|.*shared-config\.yaml$|yral-rishi-agent-new-service-template/app/|yral-rishi-agent-new-service-template/pyproject\.toml$|yral-rishi-agent-plan-and-discussions/latency-baseline-capture-from-live-services-the-numbers-v2-must-beat/daily-baseline\.csv$|yral-rishi-agent-plan-and-discussions/latency-baseline-capture-from-live-services-the-numbers-v2-must-beat/scripts/|\.github/workflows/gate-a2-pull-request-benchmark\.yml$)'
          if echo "$CHANGED_FILES" | grep -qE "$HOT_PATH_PATTERN"; then
              echo "hot_path=true" >> "$GITHUB_OUTPUT"
              echo "Hot-path file(s) detected — running E1 benchmark gate."
          else
              echo "hot_path=false" >> "$GITHUB_OUTPUT"
              echo "No hot-path files in this pull request — skipping benchmark + passing fast."
          fi

      - name: Skip benchmark for non-hot-path pull requests
        if: steps.detect_hot_path.outputs.hot_path == 'false'
        run: |
          echo "Non-hot-path pull request — E1 latency gate not applicable. Passing."

      - name: Placeholder fail-by-design for hot-path pull requests
        if: steps.detect_hot_path.outputs.hot_path == 'true'
        run: |
          # PLACEHOLDER — Session 1's benchmark script does not yet exist.
          # Once Session 1 lands the script at
          # latency-baseline-capture-from-live-services-the-numbers-v2-must-beat/scripts/run-gate-a2-pull-request-benchmark.py
          # (or similar), replace this step with a call to that script
          # and remove the explicit exit 1.
          #
          # Until then, this step FAILS BY DESIGN on every hot-path pull
          # request. That is intentional: per E1, the gate MUST exist
          # before the contract ratifies a hot-path architecture that
          # depends on it. Hot-path pull requests will block on this
          # until Session 1's script lands + this step is wired to it.
          #
          # NOTE — this workflow does NOT endorse any override path. E1 is
          # a hard merge-blocking constraint. If a specific hot-path PR
          # needs to merge before Session 1's script lands, that is a
          # one-off Rishi-typed-YES exception per the I10 process trail
          # (the kind of exception Rishi alone can grant); the workflow's
          # job is to fail loudly, not to document a "standard" recovery
          # path. Codex round-23 BLOCKER correctly flagged round-22's
          # baked-in override-merge language as conflicting with E1.
          echo "::error::Gate A2 benchmark script NOT YET WRITTEN by Session 1."
          echo "::error::See interface-contracts/01-internal-rpc-contracts.md section 'Gate A2-PR' for the contract."
          echo "::error::Per E1, hot-path PRs must wait for the script to land before merging."
          exit 1
