# Test fixture: .env.local exists but one required secret is empty.
# validate-secrets.sh should report PRESENT for one, MISSING for the other.

service: yral-rishi-agent-test-fixture

secrets:
  - name: SAMPLE_DATABASE_URL
    description: "Sample secret — populated in this fixture's .env.local."
    required_in: [local]
    source:
      local: ".env.local"
    rotation_policy: "test only"
    consumed_by: ["app/database.py"]
    classification:
      blast_radius: low
      access_pattern: read

  - name: SAMPLE_REDIS_PASSWORD
    description: "Sample secret — intentionally left blank in this fixture's .env.local."
    required_in: [local]
    source:
      local: ".env.local"
    rotation_policy: "test only"
    consumed_by: ["app/redis_client.py"]
    classification:
      blast_radius: low
      access_pattern: read
