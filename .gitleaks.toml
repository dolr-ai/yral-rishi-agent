# Phase 21αβ.I-Sec1 — gitleaks allowlist baseline.
#
# Established by the DEV-7 audit (2026-06-05). The 4 entries below are
# false-positive matches that the manual scan flagged as
# `generic-api-key` but are actually test-fixture UUIDs in archived
# orchestrator code (pre-monolith rebuild) that's preserved in git
# history but no longer shipped.
#
# Adding a new entry: only after manually confirming the match is
# truly a false positive. Real secrets get rotated, not allowlisted.
#
# Inherits the default ruleset; we extend only the allowlist.

title = "yral-rishi-agent gitleaks config"

[extend]
# Pull in gitleaks' built-in default ruleset for everything we don't
# explicitly override below.
useDefault = true

[allowlist]
description = "Pre-existing false-positive baseline from DEV-7 audit 2026-06-05"

# By specific commit SHA + file path + match string. Each entry is one
# of the four 2026-06-05 findings; if any disappears (archived dir
# removed), gitleaks simply ignores the stale allowlist entry.
commits = [
    "20ebe2577f13939160fdaf3cff98f7de57b03204",
    "9801855322667584ea502b8b46f341490728aa32",
    "7ea7e503dde283088052606b1c6b10c8c909bf12",
    "372600dbb19c43c239677c8b5066f53ecae60145",
]

# Path-prefix allow — the entire archived orchestrator tests
# directory contains UUID-shaped test fixtures that match the
# generic-api-key rule. None of these are real secrets; the directory
# is preserved in git history only.
paths = [
    '''yral-rishi-agent-conversation-turn-orchestrator/tests/.*''',
]

# Regex allow — UUID-style test idempotency keys.
# The "test-idempotency-key-001" literal also matches the
# `^(test-)?` prefix this regex catches; covers both flavors of the
# 2026-06-05 baseline findings.
regexes = [
    '''(test-)?idempotency-key-\d+''',
    '''550e8400-e29b-41d4-a716-44665544\d{4}''',
]
