# Test fixture for the "secrets.yaml exists but .env.local is missing"
# failure path. validate-secrets.sh should exit with EXIT_MISSING_VALUE.

service: yral-rishi-agent-test-fixture

secrets:
  - name: SAMPLE_DATABASE_URL
    description: "Sample secret required in local; .env.local intentionally absent."
    required_in: [local]
    source:
      local: ".env.local"
    rotation_policy: "test only"
    consumed_by:
      - app/database.py
    classification:
      blast_radius: low
      access_pattern: read
